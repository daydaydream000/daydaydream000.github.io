<article class="post">
  <header class="post-header">
    <h1 class="post-title">{{title}}</h1>
    <div class="post-meta">
      <time datetime="{{date_iso}}">{{date}}</time>
      <span class="dot">·</span><span>约 {{words}} 字</span>
      <span class="dot">·</span><span>{{reading}} 分钟阅读</span>
      {{updated_block}}
      <span class="tags">{{tags}}</span>
    </div>
  </header>

  {{cover}}
  {{toc}}

  <div class="post-content">
{{content}}
  </div>

  <footer class="post-footer">
    <span class="post-source">{{source}}</span>
    <span class="post-tags">{{tags}}</span>
  </footer>
</article>

{{neighbors}}
