<!DOCTYPE html>
<html lang="{{lang}}" data-theme="auto" data-root="{{root}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title_tag}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
<meta property="og:type" content="{{og_type}}">
<meta property="og:site_name" content="{{site_title}}">
<meta property="og:title" content="{{page_title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:image" content="{{og_image}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#f3f8f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12171a" media="(prefers-color-scheme: dark)">
<link rel="icon" href="{{root}}assets/favicon.svg" type="image/svg+xml">
<link rel="alternate" type="application/rss+xml" title="{{site_title}}" href="{{root}}rss.xml">
<link rel="stylesheet" href="{{root}}assets/style.css?v={{css_ver}}">
<script>
/* 主题与公告状态在首次绘制前应用，避免闪烁 */
(function () {
  var saved = null;
  try { saved = localStorage.getItem('dsh-theme'); } catch (e) {}
  if (saved !== 'light' && saved !== 'dark') saved = 'auto';
  var root = document.documentElement;
  root.dataset.theme = saved;
  root.classList.toggle('dark', saved === 'dark' ||
    (saved === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches));
  try {
    if (localStorage.getItem('dsh-notice') === 'off') root.classList.add('notice-off');
  } catch (e) {}
})();
</script>
{{extra_head}}
</head>
<body class="{{body_class}}">
<div id="page-progress" aria-hidden="true"></div>
<a class="skip-link" href="#main">跳到正文</a>

{{topbar}}
{{banner}}

<main id="main" class="layout">
  <div class="layout-inner">
    <aside class="col col-left">{{left}}</aside>
    <div class="col col-main">{{body}}</div>
    <aside class="col col-right">{{right}}</aside>
  </div>
</main>

<footer class="site-footer">
  <p>{{footer_text}}</p>
  <nav class="footer-nav" aria-label="页脚导航">
    <a href="{{root}}index.html">首页</a>
    <a href="{{root}}tags/index.html">标签</a>
    <a href="{{root}}about.html">关于</a>
    <a href="{{root}}rss.xml">RSS</a>
    <a href="{{github}}">GitHub</a>
    <a href="{{repo}}">源码</a>
    <a href="mailto:{{email}}">邮件</a>
  </nav>
  <p class="footer-note">本站是纯静态站点，由 build.py 生成，托管于 GitHub Pages。</p>
</footer>

<a class="back-to-top" id="back-to-top" href="#" aria-label="回到顶部" title="回到顶部">
  <svg class="i" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
       stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M12 19V5M5 12l7-7 7 7"/>
  </svg>
</a>

<div class="search-overlay" id="search-overlay" hidden>
  <div class="search-panel" role="dialog" aria-modal="true" aria-label="搜索文章">
    <div class="search-head">
      <svg class="i" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
      </svg>
      <input id="search-input" type="search" placeholder="搜索标题、标签或正文…" autocomplete="off"
             spellcheck="false" aria-label="搜索关键词">
      <kbd>Esc</kbd>
    </div>
    <div class="search-results" id="search-results"></div>
  </div>
</div>

<script src="{{root}}assets/search-index.js" defer></script>
<script src="{{root}}assets/app.js?v={{js_ver}}" defer></script>
</body>
</html>
