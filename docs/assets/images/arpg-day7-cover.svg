<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="sky7" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#cfe6f7"/>
      <stop offset="1" stop-color="#eef6fb"/>
    </linearGradient>
    <linearGradient id="grass7" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#9edb6c"/>
      <stop offset="1" stop-color="#5fa841"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1200" height="400" fill="url(#sky7)"/>
  <path d="M0,302 L1200,302 L1200,400 L0,400 Z" fill="url(#grass7)" opacity="0.45"/>
  <path d="M0,302 L210,206 L420,266 L640,196 L860,260 L1050,200 L1200,272 L1200,302 Z" fill="#7bb661" opacity="0.35"/>

  <text x="600" y="44" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="24" font-weight="700" fill="#1a3d28">ARPG 学习日志 Day 7：击杀给经验与升级</text>
  <text x="600" y="70" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="13" fill="#3a4a3a">Enemy_Health 静态事件 · ExpManager 升级公式 · ExpSlider + 等级文本</text>

  <!-- 左：Enemy_Health -->
  <g transform="translate(36, 92)">
    <text x="0" y="12" font-family="ui-sans-serif, sans-serif" font-size="12.5" font-weight="700" fill="#5a2a20">Enemy_Health（每个敌人一份）</text>
    <rect x="0" y="26" width="252" height="150" rx="4" fill="#ffffff" stroke="#1a3d28" stroke-opacity="0.35"/>
    <text x="12" y="48" font-family="ui-monospace, monospace" font-size="11.5" fill="#1a3d28">maxHealth = 3</text>
    <text x="12" y="68" font-family="ui-monospace, monospace" font-size="11.5" fill="#1a3d28">expReward = 3</text>
    <text x="12" y="94" font-family="ui-monospace, monospace" font-size="11.5" fill="#c43131">currentHealth &lt;= 0</text>
    <text x="12" y="118" font-family="ui-monospace, monospace" font-size="11" fill="#1a3d28">OnMonsterDefeated(3)</text>
    <text x="12" y="142" font-family="ui-monospace, monospace" font-size="11" fill="#1a3d28">Destroy(gameObject)</text>
    <text x="12" y="164" font-family="ui-sans-serif, sans-serif" font-size="10.5" fill="#5a2a20">玩家一刀 1 点 → 砍三刀才死</text>
  </g>

  <!-- 箭头 1 -->
  <g stroke="#1a3d28" stroke-width="2" fill="none">
    <path d="M294,182 L326,182" stroke-dasharray="5 4"/>
    <path d="M326,182 L317,177 M326,182 L317,187" stroke-linecap="round"/>
  </g>
  <text x="310" y="170" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="10" fill="#1a3d28">+3</text>
  <text x="310" y="200" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="9" fill="#5a2a20">事件</text>

  <!-- 中：ExpManager -->
  <g transform="translate(334, 92)">
    <text x="172" y="12" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="12.5" font-weight="700" fill="#5a3a20">ExpManager（挂在 ExpCanvas 上）</text>
    <rect x="0" y="26" width="344" height="150" rx="4" fill="#fff8e8" stroke="#b48a2a"/>
    <text x="12" y="48" font-family="ui-monospace, monospace" font-size="11.5" fill="#5a3a20">currentExp += amount;</text>
    <text x="12" y="70" font-family="ui-monospace, monospace" font-size="11.5" fill="#5a3a20">if (currentExp &gt;= expToLevel)</text>
    <text x="24" y="90" font-family="ui-monospace, monospace" font-size="11.5" fill="#5a3a20">LevelUp();</text>
    <text x="12" y="116" font-family="ui-monospace, monospace" font-size="11" fill="#8a5a20">level++ · expToLevel *= 1.2</text>
    <text x="12" y="140" font-family="ui-monospace, monospace" font-size="11" fill="#8a5a20">10 → 12 → 14 → 17 → 20 …</text>
    <text x="12" y="164" font-family="ui-sans-serif, sans-serif" font-size="10.5" fill="#8a5a20">每级门槛涨 20%，怪物经验不变</text>
  </g>

  <!-- 箭头 2 -->
  <g stroke="#1a3d28" stroke-width="2" fill="none">
    <path d="M684,182 L838,182" stroke-dasharray="5 4"/>
    <path d="M838,182 L829,177 M838,182 L829,187" stroke-linecap="round"/>
  </g>
  <text x="761" y="170" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="10" fill="#1a3d28">UpdateUI()</text>

  <!-- 右：HUD -->
  <g transform="translate(846, 92)">
    <text x="159" y="12" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="12.5" font-weight="700" fill="#1a3d28">左上角常驻的 HUD</text>
    <rect x="0" y="26" width="318" height="150" rx="4" fill="#1e2a22"/>
    <text x="16" y="52" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#e8f0e8">LEVEL: 1</text>
    <rect x="16" y="66" width="286" height="26" rx="3" fill="#2c3b30"/>
    <rect x="16" y="66" width="86" height="26" rx="3" fill="#42a9a4"/>
    <text x="28" y="84" font-family="ui-monospace, monospace" font-size="11" fill="#0d1a12">8 / 12</text>
    <text x="16" y="116" font-family="ui-monospace, monospace" font-size="10.5" fill="#9fb8a4">expSlider.maxValue = expToLevel</text>
    <text x="16" y="132" font-family="ui-monospace, monospace" font-size="10.5" fill="#9fb8a4">expSlider.value    = currentExp</text>
    <text x="16" y="148" font-family="ui-monospace, monospace" font-size="10.5" fill="#9fb8a4">currentLevelText.text = "Level: " + level</text>
    <text x="16" y="166" font-family="ui-sans-serif, sans-serif" font-size="10" fill="#7f9b86">进度条只表现「本级进度」，不是总经验</text>
  </g>

  <!-- 底部 -->
  <g transform="translate(0, 330)">
    <rect x="60" y="0" width="1080" height="42" rx="4" fill="#1a3d28" opacity="0.06"/>
    <text x="600" y="19" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#1a3d28">敌人死亡 → 静态事件广播 3 点经验 → ExpManager 累加/升级 → 滑块与等级文本重画</text>
    <text x="600" y="35" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="10" fill="#3a4a3a" opacity="0.7">死亡广播与经验结算解耦：敌人不认识玩家，玩家也不认识敌人</text>
  </g>
</svg>
