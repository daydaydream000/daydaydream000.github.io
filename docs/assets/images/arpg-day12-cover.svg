<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="bgD12" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf1f7"/>
      <stop offset="1" stop-color="#dbe7f0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1200" height="400" fill="url(#bgD12)"/>

  <text x="600" y="34" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="23" font-weight="700" fill="#1f3a5f">ARPG 学习日志 Day 12：弓箭模块接通</text>
  <text x="600" y="58" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="13" fill="#2a4d6e">方向瞄准 · 动画事件出箭 · 换武器切层 · 箭的两种命中</text>

  <g transform="translate(24, 84)">
    <rect x="0" y="0" width="376" height="150" rx="6" fill="#ffffff" stroke="#2a4d6e" stroke-opacity="0.45"/>
    <rect x="0" y="0" width="376" height="30" rx="6" fill="#1f3a5f"/>
    <text x="16" y="20" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#ffffff">① 瞄准</text>
    <text x="16" y="58" font-family="ui-sans-serif, sans-serif" font-size="11" fill="#3a4a5a"><tspan font-weight="700">输入：</tspan>Horizontal / Vertical（八向）</text>
    <text x="16" y="78" font-family="ui-sans-serif, sans-serif" font-size="11" fill="#3a4a5a"><tspan font-weight="700">处理：</tspan>归一化 → aimDirection</text>
    <text x="16" y="108" font-family="ui-sans-serif, sans-serif" font-size="11" fill="#1f6a3a"><tspan font-weight="700">同步：</tspan>anim.SetFloat("aimX/aimY")</text>
    <text x="16" y="128" font-family="ui-sans-serif, sans-serif" font-size="11" fill="#5a6a7a">松手保留上一次朝向</text>

    <rect x="394" y="0" width="376" height="150" rx="6" fill="#ffffff" stroke="#2a4d6e" stroke-opacity="0.45"/>
    <rect x="394" y="0" width="376" height="30" rx="6" fill="#1f3a5f"/>
    <text x="410" y="20" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#ffffff">② 射击（两段式）</text>
    <text x="410" y="58" font-family="ui-sans-serif, sans-serif" font-size="11" fill="#3a4a5a"><tspan font-weight="700">按键：</tspan>只 SetBool，定身，不出箭</text>
    <text x="410" y="78" font-family="ui-sans-serif, sans-serif" font-size="11" fill="#3a4a5a"><tspan font-weight="700">出箭：</tspan>动画事件 → Shoot()</text>
    <text x="410" y="108" font-family="ui-sans-serif, sans-serif" font-size="11" fill="#1f6a3a"><tspan font-weight="700">收益：</tspan>出箭卡在动画释放帧</text>
    <text x="410" y="128" font-family="ui-sans-serif, sans-serif" font-size="11" fill="#5a6a7a">方向在 Instantiate 后赋值仍生效</text>

    <rect x="788" y="0" width="388" height="150" rx="6" fill="#ffffff" stroke="#2a4d6e" stroke-opacity="0.45"/>
    <rect x="788" y="0" width="388" height="30" rx="6" fill="#1f3a5f"/>
    <text x="804" y="20" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#ffffff">③ 命中与换武器</text>
    <text x="804" y="58" font-family="ui-sans-serif, sans-serif" font-size="11" fill="#3a4a5a"><tspan font-weight="700">敌：</tspan>扣血 + 击退，箭不停（穿透）</text>
    <text x="804" y="78" font-family="ui-sans-serif, sans-serif" font-size="11" fill="#3a4a5a"><tspan font-weight="700">墙：</tspan>换埋入图 + kinematic + SetParent</text>
    <text x="804" y="108" font-family="ui-sans-serif, sans-serif" font-size="11" fill="#1f6a3a"><tspan font-weight="700">换武器：</tspan>翻 enabled，OnEnable 切动画层</text>
    <text x="804" y="128" font-family="ui-sans-serif, sans-serif" font-size="11" fill="#5a6a7a">组件在不在跑，就是当前武器状态</text>
  </g>

  <rect x="24" y="356" width="1152" height="26" rx="3" fill="#1f3a5f" opacity="0.06"/>
  <text x="600" y="373" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="10" fill="#2a4d6e">5 个脚本协作：Player_Bow / Arrow / Player_ChangeEqiupment / PlayerMovement / Player_Combat</text>
</svg>
