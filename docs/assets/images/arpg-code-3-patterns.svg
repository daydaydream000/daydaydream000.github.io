<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" width="1200" height="840"><rect width="1200" height="840" fill="#f5f7f3"/><text x="46.0" y="47.0" font-family="ui-sans-serif, sans-serif" font-size="23" fill="#1d2a24" text-anchor="start" font-weight="700" opacity="1.0">八个反模式：全项目扫出来的重复病灶</text><text x="46.0" y="75.0" font-family="ui-sans-serif, sans-serif" font-size="13.2" fill="#5c6b62" text-anchor="start" font-weight="400" opacity="1.0">每一种都在多处出现。数字是「这个写法在代码里出现了多少次」，不是「有几个 bug」。</text><rect x="44" y="118" width="5" height="20" rx="2.5" fill="#b3261e"/><text x="60.0" y="134.0" font-family="ui-sans-serif, sans-serif" font-size="16" fill="#b3261e" text-anchor="start" font-weight="700" opacity="1.0">① 出现次数</text><text x="176.0" y="134.0" font-family="ui-sans-serif, sans-serif" font-size="11.2" fill="#5c6b62" text-anchor="start" font-weight="400" opacity="1.0">越靠上越是结构性的，越难靠局部修补解决</text><text x="44.0" y="167.0" font-family="ui-sans-serif, sans-serif" font-size="10.6" fill="#1d2a24" text-anchor="start" font-weight="400" opacity="1.0">public 字段当接口</text><rect x="244" y="156" width="520" height="14" rx="7" fill="#b3261e" fill-opacity="0.10"/><rect x="244" y="156" width="520.0" height="14" rx="7" fill="#b3261e" fill-opacity="0.62"/><text x="776.0" y="167.0" font-family="ui-sans-serif, sans-serif" font-size="10.8" fill="#b3261e" text-anchor="start" font-weight="700" opacity="1.0">113</text><text x="820.0" y="167.0" font-family="ui-sans-serif, sans-serif" font-size="9.8" fill="#5c6b62" text-anchor="start" font-weight="400" opacity="1.0">45 个在 Player 一个目录</text><text x="44.0" y="193.0" font-family="ui-sans-serif, sans-serif" font-size="10.6" fill="#1d2a24" text-anchor="start" font-weight="400" opacity="1.0">anim.SetXxx 魔法字符串</text><rect x="244" y="182" width="520" height="14" rx="7" fill="#7a4a9e" fill-opacity="0.10"/><rect x="244" y="182" width="92.0" height="14" rx="7" fill="#7a4a9e" fill-opacity="0.62"/><text x="776.0" y="193.0" font-family="ui-sans-serif, sans-serif" font-size="10.8" fill="#7a4a9e" text-anchor="start" font-weight="700" opacity="1.0">20</text><text x="820.0" y="193.0" font-family="ui-sans-serif, sans-serif" font-size="9.8" fill="#5c6b62" text-anchor="start" font-weight="400" opacity="1.0">9 个不同参数名，写错不报错</text><text x="44.0" y="219.0" font-family="ui-sans-serif, sans-serif" font-size="10.6" fill="#1d2a24" text-anchor="start" font-weight="400" opacity="1.0">Input 轮询散在 6 个 Update</text><rect x="244" y="208" width="520" height="14" rx="7" fill="#8a6a1f" fill-opacity="0.10"/><rect x="244" y="208" width="55.2" height="14" rx="7" fill="#8a6a1f" fill-opacity="0.62"/><text x="776.0" y="219.0" font-family="ui-sans-serif, sans-serif" font-size="10.8" fill="#8a6a1f" text-anchor="start" font-weight="700" opacity="1.0">12</text><text x="820.0" y="219.0" font-family="ui-sans-serif, sans-serif" font-size="9.8" fill="#5c6b62" text-anchor="start" font-weight="400" opacity="1.0">没有统一输入层</text><text x="44.0" y="245.0" font-family="ui-sans-serif, sans-serif" font-size="10.6" fill="#1d2a24" text-anchor="start" font-weight="400" opacity="1.0">静态事件</text><rect x="244" y="234" width="520" height="14" rx="7" fill="#0f6d86" fill-opacity="0.10"/><rect x="244" y="234" width="27.6" height="14" rx="7" fill="#0f6d86" fill-opacity="0.62"/><text x="776.0" y="245.0" font-family="ui-sans-serif, sans-serif" font-size="10.8" fill="#0f6d86" text-anchor="start" font-weight="700" opacity="1.0">6</text><text x="820.0" y="245.0" font-family="ui-sans-serif, sans-serif" font-size="9.8" fill="#5c6b62" text-anchor="start" font-weight="400" opacity="1.0">解耦的关键，也是断链的源头</text><text x="44.0" y="271.0" font-family="ui-sans-serif, sans-serif" font-size="10.6" fill="#1d2a24" text-anchor="start" font-weight="400" opacity="1.0">动画事件</text><rect x="244" y="260" width="520" height="14" rx="7" fill="#5b4a9e" fill-opacity="0.10"/><rect x="244" y="260" width="27.6" height="14" rx="7" fill="#5b4a9e" fill-opacity="0.62"/><text x="776.0" y="271.0" font-family="ui-sans-serif, sans-serif" font-size="10.8" fill="#5b4a9e" text-anchor="start" font-weight="700" opacity="1.0">6</text><text x="820.0" y="271.0" font-family="ui-sans-serif, sans-serif" font-size="9.8" fill="#5c6b62" text-anchor="start" font-weight="400" opacity="1.0">判定时序写在 .anim 里</text><text x="44.0" y="297.0" font-family="ui-sans-serif, sans-serif" font-size="10.6" fill="#1d2a24" text-anchor="start" font-weight="400" opacity="1.0">hits[0] / enemies[0] 只取第一个</text><rect x="244" y="286" width="520" height="14" rx="7" fill="#2f6f4f" fill-opacity="0.10"/><rect x="244" y="286" width="23.0" height="14" rx="7" fill="#2f6f4f" fill-opacity="0.62"/><text x="776.0" y="297.0" font-family="ui-sans-serif, sans-serif" font-size="10.8" fill="#2f6f4f" text-anchor="start" font-weight="700" opacity="1.0">5</text><text x="820.0" y="297.0" font-family="ui-sans-serif, sans-serif" font-size="9.8" fill="#5c6b62" text-anchor="start" font-weight="400" opacity="1.0">多目标只结算一个</text><text x="44.0" y="323.0" font-family="ui-sans-serif, sans-serif" font-size="10.6" fill="#1d2a24" text-anchor="start" font-weight="400" opacity="1.0">Time.timeScale 当面板开关</text><rect x="244" y="312" width="520" height="14" rx="7" fill="#b3261e" fill-opacity="0.10"/><rect x="244" y="312" width="27.6" height="14" rx="7" fill="#b3261e" fill-opacity="0.62"/><text x="776.0" y="323.0" font-family="ui-sans-serif, sans-serif" font-size="10.8" fill="#b3261e" text-anchor="start" font-weight="700" opacity="1.0">6</text><text x="820.0" y="323.0" font-family="ui-sans-serif, sans-serif" font-size="9.8" fill="#5c6b62" text-anchor="start" font-weight="400" opacity="1.0">3 个文件各改各的</text><text x="44.0" y="349.0" font-family="ui-sans-serif, sans-serif" font-size="10.6" fill="#1d2a24" text-anchor="start" font-weight="400" opacity="1.0">Debug.Log 留在正式代码</text><rect x="244" y="338" width="520" height="14" rx="7" fill="#5c6b62" fill-opacity="0.10"/><rect x="244" y="338" width="23.0" height="14" rx="7" fill="#5c6b62" fill-opacity="0.62"/><text x="776.0" y="349.0" font-family="ui-sans-serif, sans-serif" font-size="10.8" fill="#5c6b62" text-anchor="start" font-weight="700" opacity="1.0">5</text><text x="820.0" y="349.0" font-family="ui-sans-serif, sans-serif" font-size="9.8" fill="#5c6b62" text-anchor="start" font-weight="400" opacity="1.0">含 gizmo 里的调试输出</text><rect x="44" y="382" width="5" height="20" rx="2.5" fill="#b3261e"/><text x="60.0" y="398.0" font-family="ui-sans-serif, sans-serif" font-size="16" fill="#b3261e" text-anchor="start" font-weight="700" opacity="1.0">② 每条的危险点与修法</text><rect x="44" y="416" width="1110" height="27" rx="6" fill="#b3261e" fill-opacity="0.10"/><text x="56.0" y="434.0" font-family="ui-sans-serif, sans-serif" font-size="10.4" fill="#b3261e" text-anchor="start" font-weight="700" opacity="1.0">反模式</text><text x="356.0" y="434.0" font-family="ui-sans-serif, sans-serif" font-size="10.4" fill="#b3261e" text-anchor="start" font-weight="700" opacity="1.0">为什么危险</text><text x="826.0" y="434.0" font-family="ui-sans-serif, sans-serif" font-size="10.4" fill="#b3261e" text-anchor="start" font-weight="700" opacity="1.0">修法</text><rect x="44" y="443" width="1110" height="27" fill="#ffffff" fill-opacity="0.62"/><text x="56.0" y="461.0" font-family="ui-monospace, monospace" font-size="10.6" fill="#1d2a24" text-anchor="start" font-weight="400" opacity="1.0">public 字段当依赖注入</text><text x="356.0" y="461.0" font-family="ui-sans-serif, sans-serif" font-size="10.6" fill="#1d2a24" text-anchor="start" font-weight="400" opacity="1.0">换场景/换预制体就得重新拖一遍，错了只在运行时空引用</text><text x="826.0" y="461.0" font-family="ui-sans-serif, sans-serif" font-size="10.6" fill="#1d2a24" text-anchor="start" font-weight="400" opacity="1.0">改成 Awake 里 GetComponent 或显式 Initialize()</text><text x="56.0" y="488.0" font-family="ui-monospace, monospace" font-size="10.6" fill="#1d2a24" text-anchor="start" font-weight="400" opacity="1.0">单例 + 双向引用</text><text x="356.0" y="488.0" font-family="ui-sans-serif, sans-serif" font-size="10.6" fill="#1d2a24" text-anchor="start" font-weight="400" opacity="1.0">StatsManger 持有 statsUI，数据层反过来依赖表现层</text><text x="826.0" y="488.0" font-family="ui-sans-serif, sans-serif" font-size="10.6" fill="#1d2a24" text-anchor="start" font-weight="400" opacity="1.0">让 UI 订阅事件，不提供服务给数据层</text><rect x="44" y="497" width="1110" height="27" fill="#ffffff" fill-opacity="0.62"/><text x="56.0" y="515.0" font-family="ui-monospace, monospace" font-size="10.6" fill="#1d2a24" text-anchor="start" font-weight="400" opacity="1.0">静态事件绑在 UI 生命周期</text><text x="356.0" y="515.0" font-family="ui-sans-serif, sans-serif" font-size="10.6" fill="#1d2a24" text-anchor="start" font-weight="400" opacity="1.0">关掉 HUD 就退订，逻辑随之失效</text><text x="826.0" y="515.0" font-family="ui-sans-serif, sans-serif" font-size="10.6" fill="#1d2a24" text-anchor="start" font-weight="400" opacity="1.0">把 ExpManager 移到常驻物体上</text><text x="56.0" y="542.0" font-family="ui-monospace, monospace" font-size="10.6" fill="#1d2a24" text-anchor="start" font-weight="400" opacity="1.0">enabled 当状态位</text><text x="356.0" y="542.0" font-family="ui-sans-serif, sans-serif" font-size="10.6" fill="#1d2a24" text-anchor="start" font-weight="400" opacity="1.0">拦得住 Update，拦不住别人直接调方法</text><text x="826.0" y="542.0" font-family="ui-sans-serif, sans-serif" font-size="10.6" fill="#1d2a24" text-anchor="start" font-weight="400" opacity="1.0">用状态机或接口，不用 enabled 当锁</text><rect x="44" y="551" width="1110" height="27" fill="#ffffff" fill-opacity="0.62"/><text x="56.0" y="569.0" font-family="ui-monospace, monospace" font-size="10.6" fill="#1d2a24" text-anchor="start" font-weight="400" opacity="1.0">动画事件承载逻辑</text><text x="356.0" y="569.0" font-family="ui-sans-serif, sans-serif" font-size="10.6" fill="#1d2a24" text-anchor="start" font-weight="400" opacity="1.0">函数名写错/改名 → 不报错、静默失效</text><text x="826.0" y="569.0" font-family="ui-sans-serif, sans-serif" font-size="10.6" fill="#1d2a24" text-anchor="start" font-weight="400" opacity="1.0">动画事件只转发到明确的入口方法</text><text x="56.0" y="596.0" font-family="ui-monospace, monospace" font-size="10.6" fill="#1d2a24" text-anchor="start" font-weight="400" opacity="1.0">skillName 字符串 switch</text><text x="356.0" y="596.0" font-family="ui-sans-serif, sans-serif" font-size="10.6" fill="#1d2a24" text-anchor="start" font-weight="400" opacity="1.0">加一份 SO 就要改代码，名字打错落进 default</text><text x="826.0" y="596.0" font-family="ui-sans-serif, sans-serif" font-size="10.6" fill="#1d2a24" text-anchor="start" font-weight="400" opacity="1.0">给 SkillSO 加枚举或 Effect 策略</text><rect x="44" y="605" width="1110" height="27" fill="#ffffff" fill-opacity="0.62"/><text x="56.0" y="623.0" font-family="ui-monospace, monospace" font-size="10.6" fill="#1d2a24" text-anchor="start" font-weight="400" opacity="1.0">魔法数字</text><text x="356.0" y="623.0" font-family="ui-sans-serif, sans-serif" font-size="10.6" fill="#1d2a24" text-anchor="start" font-weight="400" opacity="1.0">15/10、2、0.5、3、1.2 散落各处，改一处漏一处</text><text x="826.0" y="623.0" font-family="ui-sans-serif, sans-serif" font-size="10.6" fill="#1d2a24" text-anchor="start" font-weight="400" opacity="1.0">抽到 SO 或 static readonly 常量</text><text x="56.0" y="650.0" font-family="ui-monospace, monospace" font-size="10.6" fill="#1d2a24" text-anchor="start" font-weight="400" opacity="1.0">复制粘贴</text><text x="356.0" y="650.0" font-family="ui-sans-serif, sans-serif" font-size="10.6" fill="#1d2a24" text-anchor="start" font-weight="400" opacity="1.0">三份面板开关、两处 hits[0]，改一处就不同步</text><text x="826.0" y="650.0" font-family="ui-sans-serif, sans-serif" font-size="10.6" fill="#1d2a24" text-anchor="start" font-weight="400" opacity="1.0">抽公共基类或工具方法</text><rect x="44" y="416" width="1110" height="243" rx="6" fill="none" stroke="#b3261e" stroke-opacity="0.22"/><rect x="44" y="681" width="1112" height="76" rx="9" fill="#ffffff" fill-opacity="0.62" stroke="#8a8a8a" stroke-opacity="0.5" stroke-dasharray="6 4"/><text x="64.0" y="707.0" font-family="ui-sans-serif, sans-serif" font-size="12.6" fill="#8a8a8a" text-anchor="start" font-weight="700" opacity="1.0">这八个里有三个是「Unity 特有」的，也是最容易被教程带进来的</text><text x="64.0" y="730.0" font-family="ui-sans-serif, sans-serif" font-size="10.8" fill="#5c6b62" text-anchor="start" font-weight="400" opacity="1.0">enabled 当开关、动画事件承载逻辑、public 字段拖引用 —— 它们在几十行的小 demo 里都没问题，</text><text x="64.0" y="747.4" font-family="ui-sans-serif, sans-serif" font-size="10.8" fill="#5c6b62" text-anchor="start" font-weight="400" opacity="1.0">问题出在「项目长到上千行之后，这三样会同时变成隐式契约」，而隐式契约没法被编译器检查。</text><text x="64.0" y="764.8" font-family="ui-sans-serif, sans-serif" font-size="10.8" fill="#5c6b62" text-anchor="start" font-weight="400" opacity="1.0">其余五个（单例双向、静态事件、字符串 switch、魔法数字、复制粘贴）是通用工程问题。</text><defs><marker id="a-bad" viewBox="0 0 12 12" refX="10.2" refY="6" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#b3261e"/></marker><marker id="a-item" viewBox="0 0 12 12" refX="10.2" refY="6" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#7a4a9e"/></marker><marker id="a-in" viewBox="0 0 12 12" refX="10.2" refY="6" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#8a6a1f"/></marker><marker id="a-growth" viewBox="0 0 12 12" refX="10.2" refY="6" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#0f6d86"/></marker><marker id="a-ui" viewBox="0 0 12 12" refX="10.2" refY="6" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#5b4a9e"/></marker><marker id="a-player" viewBox="0 0 12 12" refX="10.2" refY="6" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#2f6f4f"/></marker><marker id="a-sub" viewBox="0 0 12 12" refX="10.2" refY="6" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#5c6b62"/></marker><marker id="a-gray" viewBox="0 0 12 12" refX="10.2" refY="6" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#8a8a8a"/></marker></defs></svg>