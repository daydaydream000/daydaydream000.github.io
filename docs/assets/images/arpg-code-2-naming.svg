<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1546" width="1200" height="1546"><rect width="1200" height="1546" fill="#f5f7f3"/><text x="46.0" y="47.0" font-family="ui-sans-serif, sans-serif" font-size="23" fill="#1d2a24" text-anchor="start" font-weight="700" opacity="1.0">命名与拼写：6 类拼写、6 处不一致</text><text x="46.0" y="75.0" font-family="ui-sans-serif, sans-serif" font-size="13.2" fill="#5c6b62" text-anchor="start" font-weight="400" opacity="1.0">这些名字不会让游戏崩，但它们会让人在搜索框里搜不到东西 —— 这是最便宜也最容易被跳过的一部分</text><rect x="44" y="118" width="5" height="20" rx="2.5" fill="#7a4a9e"/><text x="60.0" y="134.0" font-family="ui-sans-serif, sans-serif" font-size="16" fill="#7a4a9e" text-anchor="start" font-weight="700" opacity="1.0">① 拼写清单</text><text x="176.0" y="134.0" font-family="ui-sans-serif, sans-serif" font-size="11.2" fill="#5c6b62" text-anchor="start" font-weight="400" opacity="1.0">按「错误出现在多少个文件里」排序，前两个是系统性污染</text><rect x="44" y="152" width="1088" height="27" rx="6" fill="#7a4a9e" fill-opacity="0.10"/><text x="56.0" y="170.0" font-family="ui-sans-serif, sans-serif" font-size="10.4" fill="#7a4a9e" text-anchor="start" font-weight="700" opacity="1.0">现在的写法</text><text x="382.0" y="170.0" font-family="ui-sans-serif, sans-serif" font-size="10.4" fill="#7a4a9e" text-anchor="start" font-weight="700" opacity="1.0">应该是</text><text x="682.0" y="170.0" font-family="ui-sans-serif, sans-serif" font-size="10.4" fill="#7a4a9e" text-anchor="start" font-weight="700" opacity="1.0">出现在</text><text x="944.0" y="170.0" font-family="ui-sans-serif, sans-serif" font-size="10.4" fill="#7a4a9e" text-anchor="start" font-weight="700" opacity="1.0">波及</text><rect x="44" y="179" width="1088" height="27" fill="#ffffff" fill-opacity="0.62"/><text x="56.0" y="197.0" font-family="ui-monospace, monospace" font-size="10.6" fill="#1d2a24" text-anchor="start" font-weight="400" opacity="1.0">StatsManger</text><text x="382.0" y="197.0" font-family="ui-monospace, monospace" font-size="10.6" fill="#1d2a24" text-anchor="start" font-weight="400" opacity="1.0">StatsManager</text><text x="682.0" y="197.0" font-family="ui-monospace, monospace" font-size="10.6" fill="#1d2a24" text-anchor="start" font-weight="400" opacity="1.0">Player/StatsManger.cs</text><text x="944.0" y="197.0" font-family="ui-sans-serif, sans-serif" font-size="10.6" fill="#1d2a24" text-anchor="start" font-weight="400" opacity="1.0">11 个文件 + 20 处引用</text><text x="56.0" y="224.0" font-family="ui-monospace, monospace" font-size="10.6" fill="#1d2a24" text-anchor="start" font-weight="400" opacity="1.0">Player_ChangeEqiupment</text><text x="382.0" y="224.0" font-family="ui-monospace, monospace" font-size="10.6" fill="#1d2a24" text-anchor="start" font-weight="400" opacity="1.0">Player_ChangeEquipment</text><text x="682.0" y="224.0" font-family="ui-monospace, monospace" font-size="10.6" fill="#1d2a24" text-anchor="start" font-weight="400" opacity="1.0">Player/</text><text x="944.0" y="224.0" font-family="ui-sans-serif, sans-serif" font-size="10.6" fill="#1d2a24" text-anchor="start" font-weight="400" opacity="1.0">3 处（类名 + 字段 + 场景）</text><rect x="44" y="233" width="1088" height="27" fill="#ffffff" fill-opacity="0.62"/><text x="56.0" y="251.0" font-family="ui-monospace, monospace" font-size="10.6" fill="#1d2a24" text-anchor="start" font-weight="400" opacity="1.0">shootColldown</text><text x="382.0" y="251.0" font-family="ui-monospace, monospace" font-size="10.6" fill="#1d2a24" text-anchor="start" font-weight="400" opacity="1.0">shootCooldown</text><text x="682.0" y="251.0" font-family="ui-monospace, monospace" font-size="10.6" fill="#1d2a24" text-anchor="start" font-weight="400" opacity="1.0">Player_Bow</text><text x="944.0" y="251.0" font-family="ui-sans-serif, sans-serif" font-size="10.6" fill="#1d2a24" text-anchor="start" font-weight="400" opacity="1.0">3 处</text><text x="56.0" y="278.0" font-family="ui-monospace, monospace" font-size="10.6" fill="#1d2a24" text-anchor="start" font-weight="400" opacity="1.0">isKnockack</text><text x="382.0" y="278.0" font-family="ui-monospace, monospace" font-size="10.6" fill="#1d2a24" text-anchor="start" font-weight="400" opacity="1.0">isKnockback</text><text x="682.0" y="278.0" font-family="ui-monospace, monospace" font-size="10.6" fill="#1d2a24" text-anchor="start" font-weight="400" opacity="1.0">PlayerMovement</text><text x="944.0" y="278.0" font-family="ui-sans-serif, sans-serif" font-size="10.6" fill="#1d2a24" text-anchor="start" font-weight="400" opacity="1.0">2 处</text><rect x="44" y="287" width="1088" height="27" fill="#ffffff" fill-opacity="0.62"/><text x="56.0" y="305.0" font-family="ui-monospace, monospace" font-size="10.6" fill="#1d2a24" text-anchor="start" font-weight="400" opacity="1.0">OnBuyBottonClicked</text><text x="382.0" y="305.0" font-family="ui-monospace, monospace" font-size="10.6" fill="#1d2a24" text-anchor="start" font-weight="400" opacity="1.0">OnBuyButtonClicked</text><text x="682.0" y="305.0" font-family="ui-monospace, monospace" font-size="10.6" fill="#1d2a24" text-anchor="start" font-weight="400" opacity="1.0">ShopSlot</text><text x="944.0" y="305.0" font-family="ui-sans-serif, sans-serif" font-size="10.6" fill="#1d2a24" text-anchor="start" font-weight="400" opacity="1.0">2 处（含按钮绑定）</text><text x="56.0" y="332.0" font-family="ui-monospace, monospace" font-size="10.6" fill="#1d2a24" text-anchor="start" font-weight="400" opacity="1.0">Scripe（目录）</text><text x="382.0" y="332.0" font-family="ui-monospace, monospace" font-size="10.6" fill="#1d2a24" text-anchor="start" font-weight="400" opacity="1.0">Script / Scripts</text><text x="682.0" y="332.0" font-family="ui-monospace, monospace" font-size="10.6" fill="#1d2a24" text-anchor="start" font-weight="400" opacity="1.0">Assets/Scripe</text><text x="944.0" y="332.0" font-family="ui-sans-serif, sans-serif" font-size="10.6" fill="#1d2a24" text-anchor="start" font-weight="400" opacity="1.0">整个目录</text><rect x="44" y="341" width="1088" height="27" fill="#ffffff" fill-opacity="0.62"/><text x="56.0" y="359.0" font-family="ui-monospace, monospace" font-size="10.6" fill="#1d2a24" text-anchor="start" font-weight="400" opacity="1.0">ShopKeeperRennderTexture</text><text x="382.0" y="359.0" font-family="ui-monospace, monospace" font-size="10.6" fill="#1d2a24" text-anchor="start" font-weight="400" opacity="1.0">ShopKeeperRenderTexture</text><text x="682.0" y="359.0" font-family="ui-monospace, monospace" font-size="10.6" fill="#1d2a24" text-anchor="start" font-weight="400" opacity="1.0">RenderTexture 资产</text><text x="944.0" y="359.0" font-family="ui-sans-serif, sans-serif" font-size="10.6" fill="#1d2a24" text-anchor="start" font-weight="400" opacity="1.0">1 处</text><rect x="44" y="152" width="1088" height="216" rx="6" fill="none" stroke="#7a4a9e" stroke-opacity="0.22"/><text x="44.0" y="390.0" font-family="ui-sans-serif, sans-serif" font-size="10.8" fill="#b3261e" text-anchor="start" font-weight="400" opacity="1.0">最贵的是 StatsManger：11 个文件都在写这个名字，而 Unity 里改 MonoBehaviour 类名必须同步改文件名 —— 改名不是「查找替换」那么简单。</text><rect x="44" y="420" width="5" height="20" rx="2.5" fill="#8a6a1f"/><text x="60.0" y="436.0" font-family="ui-sans-serif, sans-serif" font-size="16" fill="#8a6a1f" text-anchor="start" font-weight="700" opacity="1.0">② 命名不一致：同一件事，三种叫法</text><text x="359.0" y="436.0" font-family="ui-sans-serif, sans-serif" font-size="11.2" fill="#5c6b62" text-anchor="start" font-weight="400" opacity="1.0">这类问题不影响运行，只影响「这个字段到底是干什么的」</text><rect x="44" y="454" width="1070" height="27" rx="6" fill="#8a6a1f" fill-opacity="0.10"/><text x="56.0" y="472.0" font-family="ui-sans-serif, sans-serif" font-size="10.4" fill="#8a6a1f" text-anchor="start" font-weight="700" opacity="1.0">位置</text><text x="336.0" y="472.0" font-family="ui-sans-serif, sans-serif" font-size="10.4" fill="#8a6a1f" text-anchor="start" font-weight="700" opacity="1.0">写法</text><text x="666.0" y="472.0" font-family="ui-sans-serif, sans-serif" font-size="10.4" fill="#8a6a1f" text-anchor="start" font-weight="700" opacity="1.0">问题</text><rect x="44" y="481" width="1070" height="27" fill="#ffffff" fill-opacity="0.62"/><text x="56.0" y="499.0" font-family="ui-sans-serif, sans-serif" font-size="10.6" fill="#1d2a24" text-anchor="start" font-weight="400" opacity="1.0">两个 SO 基类</text><text x="336.0" y="499.0" font-family="ui-monospace, monospace" font-size="10.6" fill="#1d2a24" text-anchor="start" font-weight="400" opacity="1.0">ItemSo / SkillSO</text><text x="666.0" y="499.0" font-family="ui-sans-serif, sans-serif" font-size="10.6" fill="#1d2a24" text-anchor="start" font-weight="400" opacity="1.0">后缀大小写不一致（So / SO）</text><text x="56.0" y="526.0" font-family="ui-sans-serif, sans-serif" font-size="10.6" fill="#1d2a24" text-anchor="start" font-weight="400" opacity="1.0">敌人模块</text><text x="336.0" y="526.0" font-family="ui-monospace, monospace" font-size="10.6" fill="#1d2a24" text-anchor="start" font-weight="400" opacity="1.0">Enemy_Health.OnMonsterDefeated</text><text x="666.0" y="526.0" font-family="ui-sans-serif, sans-serif" font-size="10.6" fill="#1d2a24" text-anchor="start" font-weight="400" opacity="1.0">同一个模块里 Enemy 与 Monster 混用</text><rect x="44" y="535" width="1070" height="27" fill="#ffffff" fill-opacity="0.62"/><text x="56.0" y="553.0" font-family="ui-sans-serif, sans-serif" font-size="10.6" fill="#1d2a24" text-anchor="start" font-weight="400" opacity="1.0">ToggleSkillTree</text><text x="336.0" y="553.0" font-family="ui-monospace, monospace" font-size="10.6" fill="#1d2a24" text-anchor="start" font-weight="400" opacity="1.0">字段名 statsCanvas</text><text x="666.0" y="553.0" font-family="ui-sans-serif, sans-serif" font-size="10.6" fill="#1d2a24" text-anchor="start" font-weight="400" opacity="1.0">实际指向的是技能面板的 CanvasGroup</text><text x="56.0" y="580.0" font-family="ui-sans-serif, sans-serif" font-size="10.6" fill="#1d2a24" text-anchor="start" font-weight="400" opacity="1.0">Player_Bow</text><text x="336.0" y="580.0" font-family="ui-monospace, monospace" font-size="10.6" fill="#1d2a24" text-anchor="start" font-weight="400" opacity="1.0">shootTimer / shootColldown</text><text x="666.0" y="580.0" font-family="ui-sans-serif, sans-serif" font-size="10.6" fill="#1d2a24" text-anchor="start" font-weight="400" opacity="1.0">一个计时器、一个间隔，后缀还不一样</text><rect x="44" y="589" width="1070" height="27" fill="#ffffff" fill-opacity="0.62"/><text x="56.0" y="607.0" font-family="ui-sans-serif, sans-serif" font-size="10.6" fill="#1d2a24" text-anchor="start" font-weight="400" opacity="1.0">全项目 private 字段</text><text x="336.0" y="607.0" font-family="ui-monospace, monospace" font-size="10.6" fill="#1d2a24" text-anchor="start" font-weight="400" opacity="1.0">isKnockack / facingDirection</text><text x="666.0" y="607.0" font-family="ui-sans-serif, sans-serif" font-size="10.6" fill="#1d2a24" text-anchor="start" font-weight="400" opacity="1.0">有没有 _ 前缀完全随机</text><text x="56.0" y="634.0" font-family="ui-sans-serif, sans-serif" font-size="10.6" fill="#1d2a24" text-anchor="start" font-weight="400" opacity="1.0">InventoryManager</text><text x="336.0" y="634.0" font-family="ui-monospace, monospace" font-size="10.6" fill="#1d2a24" text-anchor="start" font-weight="400" opacity="1.0">itemSlots / lootPrefab / player</text><text x="666.0" y="634.0" font-family="ui-sans-serif, sans-serif" font-size="10.6" fill="#1d2a24" text-anchor="start" font-weight="400" opacity="1.0">三个字段指向三种东西，命名无规律</text><rect x="44" y="454" width="1070" height="189" rx="6" fill="none" stroke="#8a6a1f" stroke-opacity="0.22"/><rect x="44" y="683" width="5" height="20" rx="2.5" fill="#b3261e"/><text x="60.0" y="699.0" font-family="ui-sans-serif, sans-serif" font-size="16" fill="#b3261e" text-anchor="start" font-weight="700" opacity="1.0">③ 把 StatsManger 改名，要走四步</text><text x="357.0" y="699.0" font-family="ui-sans-serif, sans-serif" font-size="11.2" fill="#5c6b62" text-anchor="start" font-weight="400" opacity="1.0">Unity 的 MonoBehaviour 类名必须与文件名一致，所以这不是一次查找替换</text><rect x="44" y="727" width="520" height="103.2" rx="9" fill="#ffffff" stroke="#7a4a9e" stroke-opacity="0.30" stroke-width="1.4"/><rect x="44" y="727" width="5.5" height="103.2" rx="2.7" fill="#7a4a9e" fill-opacity="0.85"/><text x="64.0" y="754.0" font-family="ui-sans-serif, sans-serif" font-size="13.5" fill="#7a4a9e" text-anchor="start" font-weight="700" opacity="1.0">① 改文件名</text><text x="64.0" y="778.0" font-family="ui-monospace, monospace" font-size="11.4" fill="#1d2a24" text-anchor="start" font-weight="400" opacity="1.0">StatsManger.cs → StatsManager.cs</text><text x="64.0" y="796.6" font-family="ui-monospace, monospace" font-size="11.4" fill="#1d2a24" text-anchor="start" font-weight="400" opacity="1.0">（.meta 跟着改名，GUID 不变）</text><rect x="44" y="874.2" width="520" height="121.80000000000001" rx="9" fill="#ffffff" stroke="#7a4a9e" stroke-opacity="0.30" stroke-width="1.4"/><rect x="44" y="874.2" width="5.5" height="121.80000000000001" rx="2.7" fill="#7a4a9e" fill-opacity="0.85"/><text x="64.0" y="901.2" font-family="ui-sans-serif, sans-serif" font-size="13.5" fill="#7a4a9e" text-anchor="start" font-weight="700" opacity="1.0">② 改类名</text><text x="64.0" y="925.2" font-family="ui-monospace, monospace" font-size="11.4" fill="#1d2a24" text-anchor="start" font-weight="400" opacity="1.0">public class StatsManger → StatsManager</text><text x="64.0" y="943.8" font-family="ui-monospace, monospace" font-size="11.4" fill="#1d2a24" text-anchor="start" font-weight="400" opacity="1.0">此时若文件名与类名不一致，</text><text x="64.0" y="962.4" font-family="ui-monospace, monospace" font-size="11.4" fill="#1d2a24" text-anchor="start" font-weight="400" opacity="1.0">Unity 会报「脚本类找不到」</text><path d="M564,935.1 L596,935.1" stroke="#8a8a8a" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 4"/><rect x="596" y="874.2" width="560" height="121.80000000000001" rx="9" fill="#ffffff" fill-opacity="0.62" stroke="#8a8a8a" stroke-opacity="0.5" stroke-dasharray="6 4"/><text x="616.0" y="900.2" font-family="ui-sans-serif, sans-serif" font-size="12.6" fill="#8a8a8a" text-anchor="start" font-weight="700" opacity="1.0">为什么必须成对改</text><text x="616.0" y="923.2" font-family="ui-sans-serif, sans-serif" font-size="10.8" fill="#5c6b62" text-anchor="start" font-weight="400" opacity="1.0">MonoBehaviour 的序列化靠「GUID + fileID」认脚本，</text><text x="616.0" y="940.6" font-family="ui-sans-serif, sans-serif" font-size="10.8" fill="#5c6b62" text-anchor="start" font-weight="400" opacity="1.0">但 Unity 编辑器还要求类名 == 文件名，</text><text x="616.0" y="958.0" font-family="ui-sans-serif, sans-serif" font-size="10.8" fill="#5c6b62" text-anchor="start" font-weight="400" opacity="1.0">否则场景里的组件会显示为 Missing (Mono Script)。</text><text x="616.0" y="975.4" font-family="ui-sans-serif, sans-serif" font-size="10.8" fill="#5c6b62" text-anchor="start" font-weight="400" opacity="1.0">所以这两步必须一起做、一次做完。</text><rect x="44" y="1040.0" width="520" height="140.4" rx="9" fill="#ffffff" stroke="#7a4a9e" stroke-opacity="0.30" stroke-width="1.4"/><rect x="44" y="1040.0" width="5.5" height="140.4" rx="2.7" fill="#7a4a9e" fill-opacity="0.85"/><text x="64.0" y="1067.0" font-family="ui-sans-serif, sans-serif" font-size="13.5" fill="#7a4a9e" text-anchor="start" font-weight="700" opacity="1.0">③ 改 11 个文件里的引用</text><text x="64.0" y="1091.0" font-family="ui-monospace, monospace" font-size="11.4" fill="#1d2a24" text-anchor="start" font-weight="400" opacity="1.0">PlayerMovement / Player_Combat / PlayerHealth</text><text x="64.0" y="1109.6" font-family="ui-monospace, monospace" font-size="11.4" fill="#1d2a24" text-anchor="start" font-weight="400" opacity="1.0">StatsUI / Player_Bow / Arrow / UseItem</text><text x="64.0" y="1128.2" font-family="ui-monospace, monospace" font-size="11.4" fill="#1d2a24" text-anchor="start" font-weight="400" opacity="1.0">InventorySlot / SkillManager / Enemy_* …</text><text x="64.0" y="1146.8" font-family="ui-monospace, monospace" font-size="11.4" fill="#1d2a24" text-anchor="start" font-weight="400" opacity="1.0">共 20 处 StatsManger.Instance</text><rect x="44" y="1224.4" width="520" height="121.80000000000001" rx="9" fill="#ffffff" stroke="#b3261e" stroke-opacity="0.30" stroke-width="1.4"/><rect x="44" y="1224.4" width="5.5" height="121.80000000000001" rx="2.7" fill="#b3261e" fill-opacity="0.85"/><text x="64.0" y="1251.4" font-family="ui-sans-serif, sans-serif" font-size="13.5" fill="#b3261e" text-anchor="start" font-weight="700" opacity="1.0">④ 回归测试</text><text x="64.0" y="1275.4" font-family="ui-monospace, monospace" font-size="11.4" fill="#1d2a24" text-anchor="start" font-weight="400" opacity="1.0">确认场景里 6 个组件没变成 Missing</text><text x="64.0" y="1294.0" font-family="ui-monospace, monospace" font-size="11.4" fill="#1d2a24" text-anchor="start" font-weight="400" opacity="1.0">确认 20 处 .Instance 都不为空</text><text x="64.0" y="1312.6" font-family="ui-monospace, monospace" font-size="11.4" fill="#1d2a24" text-anchor="start" font-weight="400" opacity="1.0">确认 Inspector 里的数值还在</text><path d="M304.0,830.2 L304.0,873.2" stroke="#7a4a9e" stroke-width="2.2" stroke-linecap="round" marker-end="url(#a-#7a4a9e)"/><path d="M304.0,996.0 L304.0,1039.0" stroke="#7a4a9e" stroke-width="2.2" stroke-linecap="round" marker-end="url(#a-#7a4a9e)"/><path d="M304.0,1180.4 L304.0,1223.4" stroke="#b3261e" stroke-width="2.2" stroke-linecap="round" marker-end="url(#a-#b3261e)"/><rect x="326.0" y="1191.7" width="86.3" height="16.3" rx="4" fill="#ffffff" fill-opacity="0.97"/><text x="326.0" y="1202.4" font-family="ui-sans-serif, sans-serif" font-size="10.2" fill="#b3261e" text-anchor="start" font-weight="500" opacity="1.0">最容易漏的一步</text><rect x="44" y="1386.2" width="1112" height="76" rx="9" fill="#ffffff" fill-opacity="0.62" stroke="#8a8a8a" stroke-opacity="0.5" stroke-dasharray="6 4"/><text x="64.0" y="1412.2" font-family="ui-sans-serif, sans-serif" font-size="12.6" fill="#8a8a8a" text-anchor="start" font-weight="700" opacity="1.0">为什么不建议现在改名</text><text x="64.0" y="1435.2" font-family="ui-sans-serif, sans-serif" font-size="10.8" fill="#5c6b62" text-anchor="start" font-weight="400" opacity="1.0">改名收益是「以后好搜」，成本是「动一次全项目最大的单例 + 6 个场景组件 + 20 处调用」。</text><text x="64.0" y="1452.6" font-family="ui-sans-serif, sans-serif" font-size="10.8" fill="#5c6b62" text-anchor="start" font-weight="400" opacity="1.0">更划算的顺序：先补掉落表、先修 P0 的逻辑错，等这些代码真的要被重用时再改名。</text><text x="64.0" y="1470.0" font-family="ui-sans-serif, sans-serif" font-size="10.8" fill="#5c6b62" text-anchor="start" font-weight="400" opacity="1.0">如果要改，就用 IDE 的 Rename 一次做完，不要分两次提交。</text><defs><marker id="a-item" viewBox="0 0 12 12" refX="10.2" refY="6" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#7a4a9e"/></marker><marker id="a-in" viewBox="0 0 12 12" refX="10.2" refY="6" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#8a6a1f"/></marker><marker id="a-bad" viewBox="0 0 12 12" refX="10.2" refY="6" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#b3261e"/></marker><marker id="a-gray" viewBox="0 0 12 12" refX="10.2" refY="6" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#8a8a8a"/></marker><marker id="a-ui" viewBox="0 0 12 12" refX="10.2" refY="6" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#5b4a9e"/></marker></defs></svg>