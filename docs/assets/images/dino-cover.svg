<svg viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Sky gradient: day to dusk -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#87CEEB"/>
      <stop offset="60%" stop-color="#F0A500"/>
      <stop offset="100%" stop-color="#2C3E50"/>
    </linearGradient>
    <!-- Ground gradient -->
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8B7355"/>
      <stop offset="100%" stop-color="#5D4E37"/>
    </linearGradient>
    <!-- Cactus gradient -->
    <linearGradient id="cactus" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2D5A27"/>
      <stop offset="50%" stop-color="#3A7A32"/>
      <stop offset="100%" stop-color="#2D5A27"/>
    </linearGradient>
    <!-- Dino gradient -->
    <linearGradient id="dino" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6B8E6B"/>
      <stop offset="100%" stop-color="#4A6F4A"/>
    </linearGradient>
    <!-- Cloud gradient -->
    <radialGradient id="cloud" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#E8F0FE" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#B0C4DE" stop-opacity="0.5"/>
    </radialGradient>
    <!-- Pterosaur -->
    <linearGradient id="ptero" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5D5D5D"/>
      <stop offset="100%" stop-color="#3A3A3A"/>
    </linearGradient>
    <!-- Sun -->
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="70%" stop-color="#FFA500"/>
      <stop offset="100%" stop-color="#FF8C00" stop-opacity="0"/>
    </radialGradient>
    <!-- Speed lines -->
    <linearGradient id="speed" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Sky background -->
  <rect width="1200" height="420" fill="url(#sky)"/>

  <!-- Sun -->
  <circle cx="1050" cy="80" r="50" fill="url(#sun)"/>

  <!-- Far mountains (silhouette) -->
  <path d="M0,280 Q200,180 400,280 Q600,150 800,280 Q1000,200 1200,280 L1200,420 L0,420 Z" fill="#1A2A3A" opacity="0.6"/>

  <!-- Clouds (floating) -->
  <g fill="url(#cloud)" opacity="0.85">
    <ellipse cx="150" cy="120" rx="70" ry="25"/>
    <ellipse cx="200" cy="110" rx="50" ry="30"/>
    <ellipse cx="90" cy="115" rx="40" ry="20"/>
    <ellipse cx="550" cy="80" rx="60" ry="22"/>
    <ellipse cx="600" cy="70" rx="45" ry="25"/>
    <ellipse cx="500" cy="78" rx="35" ry="18"/>
    <ellipse cx="950" cy="140" rx="80" ry="28"/>
    <ellipse cx="1010" cy="130" rx="55" ry="32"/>
    <ellipse cx="890" cy="138" rx="40" ry="20"/>
  </g>

  <!-- Ground (repeating pattern suggested) -->
  <rect x="0" y="340" width="1200" height="80" fill="url(#ground)"/>
  <!-- Ground top highlight -->
  <rect x="0" y="338" width="1200" height="4" fill="#A09070" opacity="0.5"/>

  <!-- Cacti (6 types suggested by cactus1-6 prefabs) -->
  <g fill="url(#cactus)">
    <!-- Cactus 1: tall single -->
    <rect x="100" y="280" width="18" height="60" rx="3"/>
    <rect x="92" y="305" width="34" height="18" rx="3"/>
    <rect x="106" y="305" width="6" height="35" rx="2"/>

    <!-- Cactus 2: double arm -->
    <rect x="300" y="300" width="16" height="40" rx="3"/>
    <rect x="290" y="315" width="36" height="14" rx="3"/>
    <rect x="304" y="315" width="8" height="25" rx="2"/>

    <!-- Cactus 3: wide triple -->
    <rect x="500" y="290" width="14" height="50" rx="3"/>
    <rect x="488" y="310" width="38" height="12" rx="3"/>
    <rect x="500" y="310" width="6" height="30" rx="2"/>
    <rect x="520" y="320" width="14" height="20" rx="3"/>

    <!-- Cactus 4: small single -->
    <rect x="680" y="315" width="14" height="25" rx="3"/>
    <rect x="674" y="330" width="26" height="10" rx="3"/>

    <!-- Cactus 5: tall with two arms -->
    <rect x="850" y="275" width="18" height="65" rx="3"/>
    <rect x="838" y="300" width="42" height="16" rx="3"/>
    <rect x="850" y="300" width="6" height="40" rx="2"/>
    <rect x="850" y="325" width="6" height="15" rx="2"/>

    <!-- Cactus 6: wide low -->
    <rect x="1020" y="310" width="16" height="30" rx="3"/>
    <rect x="1006" y="325" width="44" height="14" rx="3"/>
  </g>

  <!-- Dinosaur (player) - running pose -->
  <g transform="translate(180, 270)" fill="url(#dino)">
    <!-- Body -->
    <ellipse cx="0" cy="0" rx="28" ry="22"/>
    <!-- Head -->
    <ellipse cx="30" cy="-18" rx="18" ry="16"/>
    <!-- Snout -->
    <ellipse cx="45" cy="-16" rx="10" ry="8"/>
    <!-- Eye (white) -->
    <circle cx="38" cy="-22" r="4" fill="#FFF"/>
    <circle cx="39" cy="-22" r="2" fill="#1A2A3A"/>
    <!-- Legs (running: one forward, one back) -->
    <ellipse cx="-10" cy="20" rx="8" ry="18" transform="rotate(-15 -10 20)"/>
    <ellipse cx="10" cy="20" rx="8" ry="18" transform="rotate(25 10 20)"/>
    <!-- Tail -->
    <path d="M-28,2 Q-45,10 -40,20 Q-48,5 -35,-5 Z" fill="url(#dino)"/>
    <!-- Small arm -->
    <ellipse cx="5" cy="2" rx="6" ry="10" transform="rotate(-30 5 2)"/>
  </g>

  <!-- Pterosaur (flying) -->
  <g transform="translate(700, 180)" fill="url(#ptero)">
    <!-- Body -->
    <ellipse cx="0" cy="0" rx="14" ry="8"/>
    <!-- Head -->
    <circle cx="16" cy="-2" r="6"/>
    <!-- Wings (up position) -->
    <path d="M-2,-2 Q-35,-35 -25,-15 Q-8,-8 -2,-2 Z" opacity="0.9"/>
    <path d="M-2,2 Q-35,35 -25,15 Q-8,8 -2,2 Z" opacity="0.9"/>
    <!-- Wing membranes -->
    <path d="M-2,-2 Q-30,-30 -22,-12" stroke="#4A4A4A" stroke-width="1.5" fill="none" opacity="0.6"/>
    <path d="M-2,2 Q-30,30 -22,12" stroke="#4A4A4A" stroke-width="1.5" fill="none" opacity="0.6"/>
  </g>

  <!-- Speed lines (motion feel) -->
  <g fill="url(#speed)" opacity="0.4">
    <rect x="0" y="200" width="400" height="2" rx="1"/>
    <rect x="0" y="240" width="350" height="1.5" rx="1"/>
    <rect x="0" y="280" width="450" height="2" rx="1"/>
    <rect x="0" y="320" width="300" height="1.5" rx="1"/>
    <rect x="800" y="200" width="400" height="2" rx="1"/>
    <rect x="800" y="240" width="350" height="1.5" rx="1"/>
    <rect x="800" y="280" width="450" height="2" rx="1"/>
    <rect x="800" y="320" width="300" height="1.5" rx="1"/>
  </g>

  <!-- Distance marker (subtle) -->
  <text x="1150" y="390" font-family="monospace" font-size="14" fill="#FFFFFF" opacity="0.3" text-anchor="end">1247 m</text>
</svg>