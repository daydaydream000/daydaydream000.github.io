    <text x="318" y="112" font-family="ui-monospace, monospace" font-size="10" letter-spacing="1.4" fill="#6b7f74">功 能 目 标</text>
    <text x="318" y="136" font-family="ui-sans-serif, sans-serif" font-size="13.5" fill="#22302a">攻击动画关键帧结算伤害；受击方击退 + 眩晕后恢复</text>
  </g>
  <g>
