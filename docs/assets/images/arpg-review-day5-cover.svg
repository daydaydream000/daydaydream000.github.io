  <text x="62" y="194" font-family="ui-sans-serif, sans-serif" font-size="62" font-weight="700" fill="#ffffff">05</text>
  <text x="172" y="194" font-family="ui-sans-serif, sans-serif" font-size="14" fill="#6f9482">/ 09</text>
