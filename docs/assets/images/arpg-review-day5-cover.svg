  <text x="600" y="36" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="23" font-weight="700" fill="#183d2a">ARPG 功能复盘 Day 5：挥剑、掉血与击退眩晕</text>
  <text x="600" y="60" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="12.5" fill="#3c5147">目标：玩家能打、敌人会退会晕、双方都能被击退 ｜ 技术：动画事件 + 协程门控</text>

