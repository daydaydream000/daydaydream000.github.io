<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="sky16" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#cfe6f7"/>
      <stop offset="1" stop-color="#eef6fb"/>
    </linearGradient>
    <linearGradient id="grass16" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#9edb6c"/>
      <stop offset="1" stop-color="#5fa841"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1200" height="400" fill="url(#sky16)"/>
  <path d="M0,300 L1200,300 L1200,400 L0,400 Z" fill="url(#grass16)" opacity="0.45"/>
  <path d="M0,300 L220,208 L430,264 L650,198 L870,262 L1060,204 L1200,270 L1200,300 Z" fill="#7bb661" opacity="0.32"/>

  <text x="600" y="44" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="23" font-weight="700" fill="#1a3d28">ARPG 学习日志 Day 16：店主、交互开店与悬停信息框</text>
  <text x="600" y="70" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="13" fill="#3a4a3a">触发圈 + K/Esc 开关 · 副相机 + 256×256 RT 做立绘 · 三档商品 · 悬停跟手提示</text>

  <!-- 左：NPC + 开店 -->
  <g transform="translate(36, 94)">
    <text x="0" y="12" font-family="ui-sans-serif, sans-serif" font-size="12.5" font-weight="700" fill="#1a5a30">① 走进触发圈，按 K 开店</text>
    <rect x="0" y="26" width="316" height="154" rx="4" fill="#ffffff" stroke="#1a3d28" stroke-opacity="0.28"/>
    <rect x="0" y="26" width="316" height="154" fill="#8ed46a" opacity="0.1"/>

    <circle cx="90" cy="116" r="46" fill="none" stroke="#b48a2a" stroke-dasharray="4 3"/>
    <circle cx="90" cy="104" r="16" fill="#c9b688" stroke="#8a5a20"/>
    <path d="M90,120 L90,152" stroke="#c9b688" stroke-width="6"/>

    <circle cx="176" cy="140" r="12" fill="#3f7d5c" stroke="#1a3d28"/>
    <path d="M176,152 L176,178" stroke="#3f7d5c" stroke-width="5"/>

    <text x="90" y="196" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#8a5a20">CircleCollider2D r 1.57</text>
    <text x="176" y="196" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#1a5a30">Player</text>

    <text x="216" y="70" font-family="ui-monospace, monospace" font-size="9" fill="#1a3d28">Layer 9 = NPC</text>
    <text x="216" y="86" font-family="monospace" font-size="9" fill="#3a4a3a">（新加的一层）</text>
    <rect x="216" y="96" width="86" height="24" rx="3" fill="#fff8e8" stroke="#b48a2a"/>
    <text x="259" y="112" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#8a5a20">K 开店</text>
    <rect x="216" y="126" width="86" height="24" rx="3" fill="#f2f2f2" stroke="#9a9a9a"/>
    <text x="259" y="142" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#5a5a5a">Esc 关店</text>
  </g>

  <!-- 中：五样一起翻转 -->
  <g transform="translate(376, 94)">
    <text x="200" y="12" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="12.5" font-weight="700" fill="#1a3d28">② 一次按键翻转五样</text>
    <rect x="0" y="26" width="400" height="154" rx="4" fill="#ffffff" stroke="#1a3d28" stroke-opacity="0.28"/>

    <text x="14" y="46" font-family="ui-monospace, monospace" font-size="10" fill="#1a3d28">Time.timeScale　　0 ↔ 1</text>
    <text x="14" y="66" font-family="ui-monospace, monospace" font-size="10" fill="#1a3d28">currentShopKeeper　this ↔ null</text>
    <text x="14" y="86" font-family="ui-monospace, monospace" font-size="10" fill="#8a2a20">OnShopStateChanged　true ↔ false  ✓ 这次两边都发了</text>
    <text x="14" y="106" font-family="ui-monospace, monospace" font-size="10" fill="#1a3d28">CanvasGroup　α / 挡射线 / 可点 1 ↔ 0</text>
    <text x="14" y="126" font-family="ui-monospace, monospace" font-size="10" fill="#1a3d28">ShopKeeperCamera　SetActive(true ↔ false)</text>

    <line x1="14" y1="138" x2="386" y2="138" stroke="#1a3d28" stroke-opacity="0.14"/>
    <text x="14" y="158" font-family="ui-sans-serif, sans-serif" font-size="9.5" fill="#3a4a3a">顺序是先暂停、再置上下文、最后才亮面板 ——</text>
    <text x="14" y="172" font-family="ui-sans-serif, sans-serif" font-size="9.5" fill="#8a2a20">否则面板出现的那一帧，世界还在动</text>
  </g>

  <!-- 右：立绘 -->
  <g transform="translate(804, 94)">
    <text x="180" y="12" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="12.5" font-weight="700" fill="#5a3a20">③ 立绘是实时渲染出来的</text>
    <rect x="0" y="26" width="360" height="154" rx="4" fill="#1e2a22"/>
    <text x="14" y="48" font-family="ui-monospace, monospace" font-size="9.5" fill="#9fd8a8">Main Camera　depth −1　mask 全部</text>
    <text x="14" y="66" font-family="ui-monospace, monospace" font-size="9.5" fill="#e8f0e8">ShopKeeperCamera　depth 0　mask 512</text>
    <text x="24" y="84" font-family="ui-monospace, monospace" font-size="9" fill="#7f9b86">→ 只看得见 Layer 9，世界里只剩店主</text>

    <rect x="24" y="96" width="72" height="72" rx="3" fill="#2c3b30" stroke="#42a9a4"/>
    <circle cx="60" cy="124" r="13" fill="#3a5a48"/>
    <path d="M60,134 L60,162" stroke="#3a5a48" stroke-width="4"/>

    <text x="112" y="112" font-family="ui-monospace, monospace" font-size="9.5" fill="#e8f0e8">ShopKeeperRennderTexture</text>
    <text x="112" y="130" font-family="ui-monospace, monospace" font-size="9.5" fill="#e8f0e8">256 × 256 · m_SRGB 0</text>
    <text x="112" y="148" font-family="ui-monospace, monospace" font-size="9.5" fill="#e8f0e8">→ RawImage（不是 Image）</text>
    <text x="112" y="164" font-family="ui-sans-serif, sans-serif" font-size="9" fill="#7f9b86">RT 不是 Sprite，只能用 RawImage.texture</text>
  </g>

  <!-- 底部 -->
  <g transform="translate(0, 292)">
    <rect x="60" y="0" width="524" height="66" rx="4" fill="#fff1f0" stroke="#c43131" stroke-opacity="0.45"/>
    <text x="74" y="22" font-family="ui-sans-serif, sans-serif" font-size="11" font-weight="700" fill="#8a2a20">最硬：Interact 和 Slash 都绑在 K</text>
    <text x="74" y="42" font-family="ui-monospace, monospace" font-size="9.5" fill="#5a2a20">同一次按键 → 开店 + 挥剑（两个脚本各收各的）</text>
    <text x="74" y="58" font-family="ui-sans-serif, sans-serif" font-size="9" fill="#8a2a20">场景里还有两个 ShopKeeper 实例共用同一个 ShopManager</text>

    <rect x="600" y="0" width="566" height="66" rx="4" fill="#fff8e8" stroke="#b48a2a"/>
    <text x="614" y="22" font-family="ui-sans-serif, sans-serif" font-size="11" font-weight="700" fill="#8a5a20">这一天的收获</text>
    <text x="614" y="42" font-family="ui-sans-serif, sans-serif" font-size="9.5" fill="#5a3a20">事件从 ShopManager 挪到 ShopKeeper —— 挂到「状态的拥有者」身上</text>
    <text x="614" y="58" font-family="ui-sans-serif, sans-serif" font-size="9.5" fill="#5a3a20">商品表也挪到了店主身上 —— 不同店主可以卖不同东西</text>
  </g>
</svg>