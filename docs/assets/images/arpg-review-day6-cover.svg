<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="bg6" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#eef7f2"/>
      <stop offset="1" stop-color="#dcebf2"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1200" height="400" fill="url(#bg6)"/>

  <text x="600" y="36" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="23" font-weight="700" fill="#183d2a">ARPG 功能复盘 Day 6：把数值收进单例，把面板做成时停</text>
  <text x="600" y="60" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="12.5" fill="#3c5147">目标：数值只有一个来源，面板能暂停 ｜ 技术：单例 + timeScale + CanvasGroup.alpha</text>

  <rect x="40" y="86" width="228" height="236" rx="12" fill="#183d2a"/>
  <text x="64" y="116" font-family="ui-monospace, monospace" font-size="10.5" letter-spacing="2.4" fill="#8fb3a0">REVIEW</text>
  <text x="62" y="194" font-family="ui-sans-serif, sans-serif" font-size="62" font-weight="700" fill="#ffffff">06</text>
  <text x="172" y="194" font-family="ui-sans-serif, sans-serif" font-size="14" fill="#6f9482">/ 09</text>
  <line x1="64" y1="212" x2="150" y2="212" stroke="#4f7a5a" stroke-width="3"/>
  <text x="64" y="248" font-family="ui-sans-serif, sans-serif" font-size="16" font-weight="700" fill="#dff0e6">属性与暂停</text>
  <text x="64" y="274" font-family="ui-monospace, monospace" font-size="10" letter-spacing="1.6" fill="#7fa894">STATS</text>
  <text x="64" y="300" font-family="ui-sans-serif, sans-serif" font-size="10.5" fill="#5d7f6e">ARPGBegin · Unity 2D</text>
  <g>
    <rect x="294" y="90" width="866" height="70" rx="8" fill="#ffffff" stroke="#183d2a" stroke-opacity="0.18"/>
    <rect x="294" y="90" width="4" height="70" rx="2" fill="#4f7a5a"/>
    <text x="318" y="112" font-family="ui-monospace, monospace" font-size="10" letter-spacing="1.4" fill="#6b7f74">功 能 目 标</text>
    <text x="318" y="136" font-family="ui-sans-serif, sans-serif" font-size="13.5" fill="#22302a">伤害、速度等数值集中管理；Esc 呼出属性面板并冻结游戏</text>
  </g>
  <g>
    <rect x="294" y="170" width="866" height="70" rx="8" fill="#ffffff" stroke="#183d2a" stroke-opacity="0.18"/>
    <rect x="294" y="170" width="4" height="70" rx="2" fill="#4f7a5a"/>
    <text x="318" y="192" font-family="ui-monospace, monospace" font-size="10" letter-spacing="1.4" fill="#6b7f74">关 键 技 术</text>
    <text x="318" y="216" font-family="ui-sans-serif, sans-serif" font-size="13.5" fill="#22302a">Awake 单例去重；Time.timeScale 0/1 切换；alpha 0/1 控制可见</text>
  </g>
  <g>
    <rect x="294" y="250" width="866" height="70" rx="8" fill="#ffffff" stroke="#183d2a" stroke-opacity="0.18"/>
    <rect x="294" y="250" width="4" height="70" rx="2" fill="#4f7a5a"/>
    <text x="318" y="272" font-family="ui-monospace, monospace" font-size="10" letter-spacing="1.4" fill="#6b7f74">遗 留 问 题</text>
    <text x="318" y="296" font-family="ui-sans-serif, sans-serif" font-size="13.5" fill="#22302a">只切 alpha 没切 interactable；槽位用数组下标 0/1 硬编码</text>
  </g>
  <text x="1160" y="368" text-anchor="end" font-family="ui-monospace, monospace" font-size="10" fill="#7a8d84">功能复盘系列 · 6 / 9</text>
