<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="sky15" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#cfe6f7"/>
      <stop offset="1" stop-color="#eef6fb"/>
    </linearGradient>
    <linearGradient id="grass15" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#9edb6c"/>
      <stop offset="1" stop-color="#5fa841"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1200" height="400" fill="url(#sky15)"/>
  <path d="M0,300 L1200,300 L1200,400 L0,400 Z" fill="url(#grass15)" opacity="0.45"/>
  <path d="M0,300 L220,208 L430,264 L650,198 L870,262 L1060,204 L1200,270 L1200,300 Z" fill="#7bb661" opacity="0.32"/>

  <text x="600" y="44" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="24" font-weight="700" fill="#1a3d28">ARPG 学习日志 Day 15：商店通电——买、卖，和那间关不掉的店</text>
  <text x="600" y="70" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="13" fill="#3a4a3a">ShopItems 表提供商品与价格 · ShopSlot 显示与回调 · ShopManager 把关钱与空间</text>

  <!-- 左：商品表 -->
  <g transform="translate(40, 96)">
    <text x="0" y="12" font-family="ui-sans-serif, sans-serif" font-size="12.5" font-weight="700" fill="#5a3a20">① ShopItems（2 条）</text>
    <rect x="0" y="26" width="272" height="150" rx="4" fill="#fff8e8" stroke="#b48a2a"/>
    <text x="14" y="50" font-family="ui-monospace, monospace" font-size="10.5" fill="#8a5a20">[Serializable] class ShopItems</text>
    <line x1="14" y1="60" x2="258" y2="60" stroke="#b48a2a" stroke-opacity="0.35"/>

    <rect x="14" y="70" width="110" height="44" rx="3" fill="#ffffff" stroke="#1a3d28" stroke-opacity="0.3"/>
    <rect x="38" y="80" width="28" height="20" rx="2" fill="#b8b0a0" stroke="#6a5b3a"/>
    <text x="130" y="88" font-family="ui-monospace, monospace" font-size="10" fill="#1a3d28">Mushroom</text>
    <text x="130" y="104" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#b48a2a">2 金</text>

    <rect x="14" y="122" width="110" height="44" rx="3" fill="#ffffff" stroke="#1a3d28" stroke-opacity="0.3"/>
    <rect x="38" y="132" width="28" height="20" rx="2" fill="#e8a33d" stroke="#8a5a20"/>
    <text x="130" y="140" font-family="ui-monospace, monospace" font-size="10" fill="#1a3d28">Pumpkin</text>
    <text x="130" y="156" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#b48a2a">5 金</text>

    <text x="0" y="196" font-family="ui-sans-serif, sans-serif" font-size="10" fill="#8a5a20">挂在 ShopManager 上，跟着场景走，不是 SO</text>
  </g>

  <!-- 中：商店 8 格 -->
  <g transform="translate(348, 96)">
    <text x="186" y="12" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="12.5" font-weight="700" fill="#1a3d28">② ShopCanvas：8 个槽，只显示 2 个</text>
    <rect x="0" y="26" width="372" height="150" rx="4" fill="#ffffff" stroke="#1a3d28" stroke-opacity="0.28"/>

    <rect x="14" y="40" width="80" height="60" rx="3" fill="#ffffff" stroke="#1a7a3a"/>
    <rect x="34" y="48" width="40" height="26" rx="2" fill="#b8b0a0" stroke="#6a5b3a"/>
    <text x="54" y="88" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#1a3d28">Mushroom</text>
    <text x="54" y="98" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#b48a2a">2</text>

    <rect x="102" y="40" width="80" height="60" rx="3" fill="#ffffff" stroke="#1a7a3a"/>
    <rect x="122" y="48" width="40" height="26" rx="2" fill="#e8a33d" stroke="#8a5a20"/>
    <text x="142" y="88" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#1a3d28">Pumpkin</text>
    <text x="142" y="98" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#b48a2a">5</text>

    <g fill="#f7f7f7" stroke="#b0b0b0" stroke-dasharray="3 2">
      <rect x="190" y="40" width="80" height="60" rx="3"/>
      <rect x="278" y="40" width="80" height="60" rx="3"/>
      <rect x="14" y="108" width="80" height="60" rx="3"/>
      <rect x="102" y="108" width="80" height="60" rx="3"/>
      <rect x="190" y="108" width="80" height="60" rx="3"/>
      <rect x="278" y="108" width="80" height="60" rx="3"/>
    </g>
    <text x="230" y="76" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="8.5" fill="#9a9a9a">SetActive(false)</text>
    <text x="54" y="144" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="8.5" fill="#9a9a9a">隐藏的 6 格仍是模板位</text>

    <text x="14" y="186" font-family="ui-monospace, monospace" font-size="9.5" fill="#8a2a20">面板 1500×1000 @ (294,−103)：右侧裁 84、底部裁 63</text>
  </g>

  <!-- 右：背包 -->
  <g transform="translate(760, 96)">
    <text x="200" y="12" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="12.5" font-weight="700" fill="#5a2a20">③ 背包左键被征用</text>
    <rect x="0" y="26" width="400" height="150" rx="4" fill="#ffffff" stroke="#1a3d28" stroke-opacity="0.28"/>

    <rect x="16" y="42" width="86" height="86" rx="3" fill="#ffffff" stroke="#c43131" stroke-opacity="0.6"/>
    <rect x="42" y="62" width="34" height="24" rx="2" fill="#b8b0a0" stroke="#6a5b3a"/>
    <text x="90" y="120" text-anchor="end" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#1a3d28">3</text>
    <text x="59" y="146" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8.5" fill="#8a2a20">左键 = 卖</text>

    <rect x="114" y="42" width="86" height="86" rx="3" fill="#ffffff" stroke="#1a3d28" stroke-opacity="0.3"/>
    <rect x="140" y="62" width="34" height="24" rx="2" fill="#e8a33d" stroke="#8a5a20"/>
    <text x="188" y="120" text-anchor="end" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#1a3d28">1</text>
    <text x="157" y="146" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8.5" fill="#8a2a20">左键 = 卖</text>

    <rect x="212" y="42" width="86" height="86" rx="3" fill="#ffffff" stroke="#1a3d28" stroke-opacity="0.3" stroke-dasharray="4 3"/>
    <text x="255" y="92" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="9" fill="#8a8a8a">空槽</text>

    <rect x="308" y="42" width="76" height="40" rx="3" fill="#fff8e8" stroke="#b48a2a"/>
    <text x="318" y="58" font-family="ui-sans-serif, sans-serif" font-size="9" fill="#8a5a20">Gold</text>
    <text x="318" y="76" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#8a5a20">10</text>

    <text x="16" y="170" font-family="ui-monospace, monospace" font-size="9.5" fill="#8a2a20">activeShop 永不为 null → else 分支永远走不到</text>
  </g>

  <!-- 底部 -->
  <g transform="translate(0, 330)">
    <rect x="60" y="0" width="1080" height="42" rx="4" fill="#1a3d28" opacity="0.06"/>
    <text x="600" y="19" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#1a3d28">Start() → PopulateShopItems() → OnShopStateChanged?.Invoke(this, true)　←　false 从未发出</text>
    <text x="600" y="35" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="10" fill="#3a4a3a" opacity="0.72">买和卖都能跑，但「关店」这条路没写 —— 于是所有左键使用功能静默失效</text>
  </g>
</svg>