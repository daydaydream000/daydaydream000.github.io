<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="sky13" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#cfe6f7"/>
      <stop offset="1" stop-color="#eef6fb"/>
    </linearGradient>
    <linearGradient id="grass13" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#9edb6c"/>
      <stop offset="1" stop-color="#5fa841"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1200" height="400" fill="url(#sky13)"/>
  <path d="M0,300 L1200,300 L1200,400 L0,400 Z" fill="url(#grass13)" opacity="0.45"/>
  <path d="M0,300 L220,208 L440,264 L650,198 L870,262 L1060,206 L1200,270 L1200,300 Z" fill="#7bb661" opacity="0.33"/>

  <text x="600" y="44" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="24" font-weight="700" fill="#1a3d28">ARPG 学习日志 Day 13：掉落物、拾取动画与那 0.5 秒</text>
  <text x="600" y="70" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="13" fill="#3a4a3a">数据 + 精灵 + 触发体 + 一个脚本 · 事件在 0 秒结算，物体在 0.5 秒后才消失</text>

  <!-- 左：地上的东西 -->
  <g transform="translate(40, 96)">
    <text x="0" y="12" font-family="ui-sans-serif, sans-serif" font-size="12.5" font-weight="700" fill="#1a3d28">① 地上的三个 Loot</text>
    <rect x="0" y="26" width="300" height="150" rx="4" fill="#ffffff" stroke="#1a3d28" stroke-opacity="0.28"/>
    <rect x="0" y="26" width="300" height="150" fill="#8ed46a" opacity="0.12"/>

    <!-- 三个物品 + 触发圈 -->
    <circle cx="62" cy="132" r="34" fill="none" stroke="#b48a2a" stroke-dasharray="4 3"/>
    <rect x="50" y="120" width="24" height="18" rx="2" fill="#e8a33d" stroke="#8a5a20"/>
    <text x="62" y="176" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#8a5a20">Pumpkin ×1</text>

    <circle cx="156" cy="132" r="34" fill="none" stroke="#b48a2a" stroke-dasharray="4 3"/>
    <rect x="144" y="120" width="24" height="18" rx="2" fill="#b8b0a0" stroke="#6a5b3a"/>
    <text x="156" y="176" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#8a5a20">Mushroom ×2</text>

    <circle cx="250" cy="132" r="34" fill="none" stroke="#b48a2a" stroke-dasharray="4 3"/>
    <circle cx="250" cy="129" r="9" fill="#e8c33d" stroke="#8a5a20"/>
    <text x="250" y="176" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#8a5a20">Gold ×5</text>

    <text x="0" y="200" font-family="ui-sans-serif, sans-serif" font-size="10" fill="#3a4a3a">虚线 = CircleCollider2D（IsTrigger，r 0.5）· 图标由 itemSo.icon 填</text>
  </g>

  <!-- 中：三段时间 -->
  <g transform="translate(364, 96)">
    <text x="216" y="12" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="12.5" font-weight="700" fill="#5a2a20">② 接触之后的三段</text>
    <rect x="0" y="26" width="432" height="150" rx="4" fill="#ffffff" stroke="#1a3d28" stroke-opacity="0.28"/>

    <line x1="20" y1="86" x2="412" y2="86" stroke="#1a3d28" stroke-opacity="0.35"/>
    <line x1="20" y1="80" x2="20" y2="92" stroke="#c43131" stroke-width="2"/>
    <line x1="278" y1="80" x2="278" y2="92" stroke="#1a3d28"/>
    <line x1="392" y1="80" x2="392" y2="92" stroke="#c43131" stroke-width="2"/>

    <rect x="20" y="100" width="258" height="20" rx="2" fill="#8ecf6e" opacity="0.6" stroke="#4f9636"/>
    <text x="149" y="114" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9.5" fill="#1a3d28">LootPickup 0 → 0.333 s</text>
    <rect x="278" y="100" width="114" height="20" rx="2" fill="#f0e2c8" stroke="#b48a2a" stroke-dasharray="3 2"/>

    <text x="20" y="66" font-family="ui-monospace, monospace" font-size="9.5" fill="#8a2a20">0 s：事件已发（背包已加）</text>
    <text x="278" y="66" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9.5" fill="#1a3d28">0.333 动画完</text>
    <text x="392" y="66" text-anchor="end" font-family="ui-monospace, monospace" font-size="9.5" fill="#8a2a20">0.5 销毁</text>

    <text x="20" y="146" font-family="ui-sans-serif, sans-serif" font-size="10" fill="#8a2a20">这 0.5 秒里物体仍然活着：能再触发、也会被暂停冻住</text>
    <text x="20" y="164" font-family="ui-sans-serif, sans-serif" font-size="10" fill="#3a4a3a">所以「防重复」和「暂停」两个坑都长在这段时间里</text>
  </g>

  <!-- 右：事件出口 -->
  <g transform="translate(824, 96)">
    <text x="168" y="12" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="12.5" font-weight="700" fill="#1a5a30">③ 一个静态事件，多个出口</text>
    <rect x="0" y="26" width="336" height="150" rx="4" fill="#1e2a22"/>
    <text x="16" y="50" font-family="ui-monospace, monospace" font-size="10.5" fill="#9fd8a8">static event Action&lt;ItemSo,int&gt;</text>
    <text x="16" y="70" font-family="ui-monospace, monospace" font-size="10.5" fill="#e8f0e8">OnItemLooted</text>

    <rect x="16" y="84" width="304" height="26" rx="2" fill="#2c3b30"/>
    <text x="28" y="102" font-family="ui-monospace, monospace" font-size="10" fill="#e8f0e8">InventoryManager.AddItem → 堆叠 / 空槽</text>
    <rect x="16" y="114" width="304" height="26" rx="2" fill="#2c3b30"/>
    <text x="28" y="132" font-family="ui-monospace, monospace" font-size="10" fill="#e8f0e8">isGold → gold += quantity</text>
    <rect x="16" y="144" width="304" height="22" rx="2" fill="#2c3b30"/>
    <text x="28" y="160" font-family="ui-monospace, monospace" font-size="9.5" fill="#7f9b86">以后：音效 / 飘字 / 任务计数</text>
  </g>

  <!-- 底部 -->
  <g transform="translate(0, 330)">
    <rect x="60" y="0" width="1080" height="42" rx="4" fill="#1a3d28" opacity="0.06"/>
    <text x="600" y="19" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#1a3d28">OnTriggerEnter2D → anim.Play(LootPickup) → OnItemLooted?.Invoke(itemSo, quantity) → Destroy(gameObject, 0.5f)</text>
    <text x="600" y="35" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="10" fill="#3a4a3a" opacity="0.72">拾取是瞬时的逻辑，演出是 0.5 秒的账 —— 两者错开，坑就长在中间</text>
  </g>
</svg>