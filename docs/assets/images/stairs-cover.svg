<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="楼梯：无尽下坠">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#1b2942"/>
      <stop offset="0.5" stop-color="#314d79"/>
      <stop offset="1" stop-color="#141d33"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d1526"/>
      <stop offset="1" stop-color="#26365a"/>
    </linearGradient>
    <linearGradient id="wallr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#26365a"/>
      <stop offset="1" stop-color="#0d1526"/>
    </linearGradient>
    <linearGradient id="plat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c3c8d1"/>
      <stop offset="1" stop-color="#7b818b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.58">
      <stop offset="0" stop-color="#8fb6ff" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#8fb6ff" stop-opacity="0"/>
    </radialGradient>
    <g id="sp">
      <path d="M0 0 L28 60 L56 0 Z" fill="#8f1a1a"/>
      <path d="M28 60 L42 26 L56 0 L28 0 Z" fill="#c22b2b" opacity="0.7"/>
    </g>
    <g id="spu">
      <path d="M0 60 L28 0 L56 60 Z" fill="#8f1a1a"/>
      <path d="M28 0 L42 34 L56 60 L28 60 Z" fill="#c22b2b" opacity="0.7"/>
    </g>
  </defs>

  <rect width="1200" height="420" fill="url(#sky)"/>
  <rect width="1200" height="420" fill="url(#glow)"/>

  <!-- 井壁 -->
  <rect x="76" y="0" width="52" height="420" fill="url(#wall)"/>
  <rect x="1072" y="0" width="52" height="420" fill="url(#wallr)"/>
  <rect x="128" y="0" width="4" height="420" fill="#5b7fb8" opacity="0.5"/>
  <rect x="1068" y="0" width="4" height="420" fill="#5b7fb8" opacity="0.5"/>

  <!-- 星点 -->
  <g fill="#d3e2ff" opacity="0.45">
    <circle cx="270" cy="104" r="2"/><circle cx="470" cy="62" r="1.6"/>
    <circle cx="640" cy="140" r="2"/><circle cx="846" cy="82" r="1.6"/>
    <circle cx="392" cy="212" r="1.6"/><circle cx="962" cy="230" r="1.6"/>
    <circle cx="212" cy="318" r="1.6"/><circle cx="700" cy="316" r="1.6"/>
  </g>

  <!-- 上下尖刺 -->
  <g>
    <use href="#sp" x="136" y="0"/><use href="#sp" x="192" y="0"/>
    <use href="#sp" x="248" y="0"/><use href="#sp" x="304" y="0"/>
    <use href="#sp" x="360" y="0"/><use href="#sp" x="416" y="0"/>
    <use href="#sp" x="472" y="0"/><use href="#sp" x="528" y="0"/>
    <use href="#sp" x="584" y="0"/><use href="#sp" x="640" y="0"/>
    <use href="#sp" x="696" y="0"/><use href="#sp" x="752" y="0"/>
    <use href="#sp" x="808" y="0"/><use href="#sp" x="864" y="0"/>
    <use href="#sp" x="920" y="0"/><use href="#sp" x="976" y="0"/>
    <use href="#sp" x="1032" y="0"/>
  </g>
  <g>
    <use href="#spu" x="136" y="360"/><use href="#spu" x="192" y="360"/>
    <use href="#spu" x="248" y="360"/><use href="#spu" x="304" y="360"/>
    <use href="#spu" x="360" y="360"/><use href="#spu" x="416" y="360"/>
    <use href="#spu" x="472" y="360"/><use href="#spu" x="528" y="360"/>
    <use href="#spu" x="584" y="360"/><use href="#spu" x="640" y="360"/>
    <use href="#spu" x="696" y="360"/><use href="#spu" x="752" y="360"/>
    <use href="#spu" x="808" y="360"/><use href="#spu" x="864" y="360"/>
    <use href="#spu" x="920" y="360"/><use href="#spu" x="976" y="360"/>
    <use href="#spu" x="1032" y="360"/>
  </g>

  <!-- 地板 -->
  <g fill="url(#plat)">
    <rect x="196" y="128" width="200" height="38" rx="6"/>
    <rect x="612" y="212" width="200" height="38" rx="6"/>
    <rect x="330" y="286" width="200" height="38" rx="6"/>
    <rect x="760" y="150" width="200" height="38" rx="6"/>
  </g>

  <!-- 玩家 -->
  <g transform="translate(470,206)">
    <ellipse cx="27" cy="96" rx="36" ry="10" fill="#000" opacity="0.3"/>
    <rect x="6" y="0" width="42" height="92" rx="21" fill="#e9effd"/>
    <rect x="6" y="0" width="42" height="92" rx="21" fill="none" stroke="#9db4dd" stroke-width="2"/>
    <circle cx="27" cy="26" r="8" fill="#2f9e7f"/>
  </g>

  <!-- 下落轨迹 -->
  <g stroke="#dbe7ff" stroke-width="2.4" stroke-linecap="round" opacity="0.4">
    <path d="M300 188 v22"/><path d="M300 232 v30"/>
    <path d="M888 168 v18"/><path d="M888 206 v30"/>
    <path d="M600 118 v16"/>
  </g>
</svg>
