<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="bg8" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#eef7f2"/>
      <stop offset="1" stop-color="#dcebf2"/>
    </linearGradient>
    <linearGradient id="screen8" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#26323e"/>
      <stop offset="1" stop-color="#151e27"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1200" height="400" fill="url(#bg8)"/>

  <text x="600" y="34" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="23" font-weight="700" fill="#183d2a">ARPG 学习日志 Day 8：把 UI 收进 UIManager，先摆一块技能面板</text>
  <text x="600" y="58" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="13" fill="#3c5147">0 行新脚本 · 两个 Overlay Canvas · 24 个空格子 · 一块看得见却点不到的面板</text>

  <!-- 左：层级 -->
  <g transform="translate(24, 78)">
    <rect x="0" y="0" width="238" height="40" rx="4" fill="#ffffff" stroke="#183d2a" stroke-opacity="0.45"/>
    <text x="10" y="18" font-family="ui-monospace, monospace" font-size="11.5" font-weight="700" fill="#183d2a">UIManager</text>
    <text x="10" y="32" font-family="ui-sans-serif, sans-serif" font-size="8.5" fill="#6a5b3a">空 GameObject · 一个脚本都没挂</text>

    <path d="M14,40 L14,54 M14,54 L14,62 M14,54 L130,54 L130,62" stroke="#183d2a" stroke-opacity="0.45" fill="none"/>

    <rect x="0" y="62" width="112" height="42" rx="3" fill="#ffffff" stroke="#183d2a" stroke-opacity="0.28"/>
    <text x="8" y="79" font-family="ui-monospace, monospace" font-size="10" fill="#183d2a">StatsCanvas</text>
    <text x="8" y="94" font-family="ui-sans-serif, sans-serif" font-size="8.5" fill="#5a4a2a">sort 0 · Layer 5 · UI</text>

    <rect x="126" y="62" width="112" height="42" rx="3" fill="#fff6e6" stroke="#b48a2a"/>
    <text x="134" y="79" font-family="ui-monospace, monospace" font-size="10" fill="#5a3a20">SkillCanvass</text>
    <text x="134" y="94" font-family="ui-sans-serif, sans-serif" font-size="8.5" fill="#8a5a20">sort 1 · Layer 0</text>

    <path d="M182,104 L182,116" stroke="#b48a2a" fill="none"/>
    <rect x="126" y="116" width="112" height="38" rx="3" fill="#ffffff" stroke="#b48a2a" stroke-opacity="0.5"/>
    <text x="134" y="132" font-family="ui-monospace, monospace" font-size="9.5" fill="#5a3a20">SkillPanel</text>
    <text x="134" y="146" font-family="ui-sans-serif, sans-serif" font-size="8.5" fill="#8a5a20">1200 × 1200 · 空壳</text>

    <text x="0" y="180" font-family="ui-sans-serif, sans-serif" font-size="9" fill="#8a2a20">ExpCanvas / PlayerUI 还留在场景根级</text>
    <text x="0" y="196" font-family="ui-sans-serif, sans-serif" font-size="9" fill="#3c5147">24 个技能格子 · 0 个 Button</text>
  </g>

  <!-- 中：Game 视图 -->
  <rect x="284" y="86" width="512" height="256" rx="6" fill="url(#screen8)"/>
  <text x="292" y="80" font-family="ui-sans-serif, sans-serif" font-size="9.5" fill="#5a6a72">Game 视图 · 参考分辨率 1920 × 1080</text>

  <rect x="328" y="100" width="424" height="228" rx="4" fill="#efeadd" stroke="#8a7a52" stroke-opacity="0.55"/>
  <rect x="348" y="110" width="384" height="42" rx="3" fill="#d8c7a0"/>
  <text x="540" y="138" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="18" font-weight="700" fill="#2a2113">Skills Panel</text>

  <!-- 两棵树 -->
  <rect x="348" y="164" width="184" height="140" rx="3" fill="#f9f6ec" stroke="#8a7a52" stroke-opacity="0.55"/>
  <rect x="348" y="164" width="184" height="20" fill="#c9b688"/>
  <text x="440" y="178" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="10" font-weight="700" fill="#2a2113">Combat</text>

  <rect x="540" y="164" width="184" height="140" rx="3" fill="#f9f6ec" stroke="#8a7a52" stroke-opacity="0.55"/>
  <rect x="540" y="164" width="184" height="20" fill="#c9b688"/>
  <text x="632" y="178" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="10" font-weight="700" fill="#2a2113">MAGIC</text>

  <g fill="#dfe6dc" stroke="#8a9a86" stroke-opacity="0.85">
    <!-- 左树 3 × 4 -->
    <rect x="366" y="194" width="44" height="22" rx="2"/><rect x="416" y="194" width="44" height="22" rx="2"/><rect x="466" y="194" width="44" height="22" rx="2"/>
    <rect x="366" y="222" width="44" height="22" rx="2"/><rect x="416" y="222" width="44" height="22" rx="2"/><rect x="466" y="222" width="44" height="22" rx="2"/>
    <rect x="366" y="250" width="44" height="22" rx="2"/><rect x="416" y="250" width="44" height="22" rx="2"/><rect x="466" y="250" width="44" height="22" rx="2"/>
    <rect x="366" y="278" width="44" height="22" rx="2"/><rect x="416" y="278" width="44" height="22" rx="2"/><rect x="466" y="278" width="44" height="22" rx="2"/>
    <!-- 右树 3 × 4 -->
    <rect x="558" y="194" width="44" height="22" rx="2"/><rect x="608" y="194" width="44" height="22" rx="2"/><rect x="658" y="194" width="44" height="22" rx="2"/>
    <rect x="558" y="222" width="44" height="22" rx="2"/><rect x="608" y="222" width="44" height="22" rx="2"/><rect x="658" y="222" width="44" height="22" rx="2"/>
    <rect x="558" y="250" width="44" height="22" rx="2"/><rect x="608" y="250" width="44" height="22" rx="2"/><rect x="658" y="250" width="44" height="22" rx="2"/>
    <rect x="558" y="278" width="44" height="22" rx="2"/><rect x="608" y="278" width="44" height="22" rx="2"/><rect x="658" y="278" width="44" height="22" rx="2"/>
  </g>

  <rect x="540" y="306" width="184" height="18" rx="2" fill="#c9d8c4" stroke="#7f9b86"/>
  <rect x="541" y="307" width="16" height="16" fill="#8ba883"/>
  <text x="716" y="319" text-anchor="end" font-family="ui-monospace, monospace" font-size="8" fill="#2a3a2a">Skill Point: 10</text>

  <!-- 右：三张卡 -->
  <g transform="translate(820, 78)">
    <rect x="0" y="0" width="356" height="74" rx="4" fill="#ffffff" stroke="#183d2a" stroke-opacity="0.26"/>
    <text x="12" y="20" font-family="ui-sans-serif, sans-serif" font-size="11.5" font-weight="700" fill="#183d2a">① 两张 Overlay Canvas 是兄弟</text>
    <text x="12" y="40" font-family="ui-monospace, monospace" font-size="10" fill="#3c5147">StatsCanvas.sortingOrder = 0</text>
    <text x="12" y="56" font-family="ui-monospace, monospace" font-size="10" fill="#3c5147">SkillCanvass.sortingOrder = 1</text>
    <text x="12" y="69" font-family="ui-sans-serif, sans-serif" font-size="8.5" fill="#6a5b3a">谁在上面只由这个数字决定</text>

    <rect x="0" y="84" width="356" height="74" rx="4" fill="#fff6e6" stroke="#b48a2a"/>
    <text x="12" y="104" font-family="ui-sans-serif, sans-serif" font-size="11.5" font-weight="700" fill="#5a3a20">② 看得见，但点不到</text>
    <text x="12" y="124" font-family="ui-monospace, monospace" font-size="10" fill="#8a5a20">alpha 1 · interactable 0</text>
    <text x="12" y="140" font-family="ui-monospace, monospace" font-size="10" fill="#8a5a20">blocksRaycasts 0</text>
    <text x="12" y="153" font-family="ui-sans-serif, sans-serif" font-size="8.5" fill="#8a5a20">CanvasGroup 三个开关各管一件事</text>

    <rect x="0" y="168" width="356" height="74" rx="4" fill="#ffffff" stroke="#183d2a" stroke-opacity="0.26"/>
    <text x="12" y="188" font-family="ui-sans-serif, sans-serif" font-size="11.5" font-weight="700" fill="#183d2a">③ 网格是算出来的</text>
    <text x="12" y="208" font-family="ui-monospace, monospace" font-size="10" fill="#3c5147">cell 85 × 85 · spacing 5 · 12 格</text>
    <text x="12" y="224" font-family="ui-monospace, monospace" font-size="10" fill="#3c5147">3 列 × 4 行 · 宽 265 / 余 15</text>
    <text x="12" y="237" font-family="ui-sans-serif, sans-serif" font-size="8.5" fill="#5a4a2a">占位物体只有 RectTransform，不参与射线</text>
  </g>

  <rect x="24" y="350" width="1152" height="26" rx="3" fill="#183d2a" opacity="0.06"/>
  <text x="600" y="367" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="10" fill="#3c5147">今天动的全是「位置」和「可见性」：层级往上收一层、面板往屏幕上摆一层、开关藏进 CanvasGroup</text>
</svg>
