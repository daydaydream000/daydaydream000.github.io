    <circle cx="676" cy="96" r="2.2"/>
    <circle cx="812" cy="168" r="1.6"/>
    <circle cx="950" cy="76" r="2.1"/>
    <circle cx="1082" cy="146" r="1.8"/>
    <circle cx="196" cy="250" r="1.5"/>
    <circle cx="1040" cy="286" r="1.6"/>
  </g>

