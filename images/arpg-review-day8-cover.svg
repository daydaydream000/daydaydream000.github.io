<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="bg8" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#eef7f2"/>
      <stop offset="1" stop-color="#dcebf2"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1200" height="400" fill="url(#bg8)"/>

  <text x="600" y="36" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="23" font-weight="700" fill="#183d2a">ARPG 功能复盘 Day 8：0 行脚本的一天，搭出技能面板骨架</text>
  <text x="600" y="60" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="12.5" fill="#3c5147">目标：UI 有了统一父节点，技能面板先摆出空间 ｜ 技术：CanvasGroup 三件套 + sortingOrder</text>

  <rect x="40" y="86" width="228" height="236" rx="12" fill="#183d2a"/>
  <text x="64" y="116" font-family="ui-monospace, monospace" font-size="10.5" letter-spacing="2.4" fill="#8fb3a0">REVIEW</text>
  <text x="62" y="194" font-family="ui-sans-serif, sans-serif" font-size="62" font-weight="700" fill="#ffffff">08</text>
  <text x="172" y="194" font-family="ui-sans-serif, sans-serif" font-size="14" fill="#6f9482">/ 09</text>
  <line x1="64" y1="212" x2="150" y2="212" stroke="#3a6b6b" stroke-width="3"/>
  <text x="64" y="248" font-family="ui-sans-serif, sans-serif" font-size="16" font-weight="700" fill="#dff0e6">UI 收拢与技能面板</text>
  <text x="64" y="274" font-family="ui-monospace, monospace" font-size="10" letter-spacing="1.6" fill="#7fa894">UI SHELL</text>
  <text x="64" y="300" font-family="ui-sans-serif, sans-serif" font-size="10.5" fill="#5d7f6e">ARPGBegin · Unity 2D</text>
  <g>
    <rect x="294" y="90" width="866" height="70" rx="8" fill="#ffffff" stroke="#183d2a" stroke-opacity="0.18"/>
    <rect x="294" y="90" width="4" height="70" rx="2" fill="#3a6b6b"/>
    <text x="318" y="112" font-family="ui-monospace, monospace" font-size="10" letter-spacing="1.4" fill="#6b7f74">功 能 目 标</text>
    <text x="318" y="136" font-family="ui-sans-serif, sans-serif" font-size="13.5" fill="#22302a">UIManager 收拢三块 Canvas；1200 面板 + 两棵树 + 24 个占位格</text>
  </g>
  <g>
    <rect x="294" y="170" width="866" height="70" rx="8" fill="#ffffff" stroke="#183d2a" stroke-opacity="0.18"/>
