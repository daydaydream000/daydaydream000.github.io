  <text x="600" y="386" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10.5" fill="#3a4a3a">expToLevel = Mathf.RoundToInt(expToLevel * 1.2f)　｜　下一级门槛只和上一级有关，与 level 无关</text>
