  <text x="600" y="36" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="23" font-weight="700" fill="#183d2a">ARPG 功能复盘 Day 2：七层瓦片与「钻山洞」的碰撞开关</text>
  <text x="600" y="60" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="12.5" fill="#3c5147">目标：地图分层表达遮挡与碰撞 ｜ 技术：Trigger 换碰撞体 + sortingOrder 抬高</text>

