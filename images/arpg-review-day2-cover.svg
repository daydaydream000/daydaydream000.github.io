  <text x="64" y="248" font-family="ui-sans-serif, sans-serif" font-size="16" font-weight="700" fill="#dff0e6">七层瓦片</text>
  <text x="64" y="274" font-family="ui-monospace, monospace" font-size="10" letter-spacing="1.6" fill="#7fa894">TILEMAP</text>
  <text x="64" y="300" font-family="ui-sans-serif, sans-serif" font-size="10.5" fill="#5d7f6e">ARPGBegin · Unity 2D</text>
  <g>
    <rect x="294" y="90" width="866" height="70" rx="8" fill="#ffffff" stroke="#183d2a" stroke-opacity="0.18"/>
    <rect x="294" y="90" width="4" height="70" rx="2" fill="#3a6b7a"/>
