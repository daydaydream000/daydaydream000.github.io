<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 620" width="820" height="620" role="img" aria-label="DownStair 场景纵剖面">
  <defs>
    <style>
      .t   { font-family: 'PingFang SC','Microsoft YaHei','Noto Sans SC',system-ui,sans-serif; }
      .h   { font-size: 21px; font-weight: 700; fill: #1a1d21; }
      .m   { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 15px; fill: #4b5563; }
      .s   { font-size: 14px; fill: #6b7280; }
      .dim { stroke: #8b93a1; stroke-width: 1.3; }
    </style>
    <marker id="d2" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="6" markerHeight="6">
      <path d="M0 0 L8 4 L0 8 z" fill="#8b93a1"/>
    </marker>
    <marker id="lead" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 1 L7 4 L0 7 z" fill="#2f9e7f"/>
    </marker>
  </defs>

  <rect width="820" height="620" fill="#fbfbfd"/>
  <text class="t h" x="24" y="40">DownStair 场景纵剖面</text>
  <text class="t s" x="24" y="66">摄像机在 y = 0，以 2 单位/秒匀速下移；两排尖刺是它的子物体，永远贴着屏幕上下沿。</text>

  <!-- 摄像机视野 -->
  <rect x="130" y="201" width="470" height="278" fill="#eaf2fb" opacity="0.65"/>
  <rect x="130" y="201" width="470" height="278" fill="none" stroke="#4a7fd4" stroke-width="2" stroke-dasharray="8 5"/>
  <text class="t m" x="430" y="442" fill="#2f6feb">视野高 10.72</text>

  <!-- 井壁 ±3 单位 -->
  <rect x="204" y="150" width="18" height="420" fill="#2b3a55"/>
  <rect x="378" y="150" width="18" height="420" fill="#2b3a55"/>
  <path class="dim" d="M192 150 V570" marker-start="url(#d2)" marker-end="url(#d2)"/>
  <text class="t m" x="16" y="368">碰撞体</text>
  <text class="t m" x="16" y="388">1 × 274.5</text>
  <text class="t s" x="16" y="408">精灵 13.7 高</text>

  <!-- 尖刺 y = 209 / 488 -->
  <g fill="#b42626">
    <path d="M118 209 l11 21 l11 -21 z"/><path d="M148 209 l11 21 l11 -21 z"/>
    <path d="M178 209 l11 21 l11 -21 z"/><path d="M208 209 l11 21 l11 -21 z"/>
    <path d="M238 209 l11 21 l11 -21 z"/><path d="M268 209 l11 21 l11 -21 z"/>
    <path d="M298 209 l11 21 l11 -21 z"/><path d="M328 209 l11 21 l11 -21 z"/>
    <path d="M358 209 l11 21 l11 -21 z"/><path d="M388 209 l11 21 l11 -21 z"/>
    <path d="M418 209 l11 21 l11 -21 z"/><path d="M448 209 l11 21 l11 -21 z"/>
    <path d="M478 209 l11 21 l11 -21 z"/><path d="M508 209 l11 21 l11 -21 z"/>
    <path d="M538 209 l11 21 l11 -21 z"/>
  </g>
  <text class="t m" x="590" y="228" fill="#a12222">陷阱 上 +5.05</text>

  <g fill="#b42626">
    <path d="M118 488 l11 -21 l11 21 z"/><path d="M148 488 l11 -21 l11 21 z"/>
    <path d="M178 488 l11 -21 l11 21 z"/><path d="M208 488 l11 -21 l11 21 z"/>
    <path d="M238 488 l11 -21 l11 21 z"/><path d="M268 488 l11 -21 l11 21 z"/>
    <path d="M298 488 l11 -21 l11 21 z"/><path d="M328 488 l11 -21 l11 21 z"/>
    <path d="M358 488 l11 -21 l11 21 z"/><path d="M388 488 l11 -21 l11 21 z"/>
    <path d="M418 488 l11 -21 l11 21 z"/><path d="M448 488 l11 -21 l11 21 z"/>
    <path d="M478 488 l11 -21 l11 21 z"/><path d="M508 488 l11 -21 l11 21 z"/>
    <path d="M538 488 l11 -21 l11 21 z"/>
  </g>
  <text class="t m" x="590" y="500" fill="#a12222">陷阱 下 −5.70</text>

  <!-- 地板 y = 340 / 418 / 496，宽 2 单位 = 52px -->
  <g fill="#adb3bc" stroke="#8e949e">
    <rect x="222" y="334" width="52" height="11" rx="3"/>
    <rect x="292" y="412" width="52" height="11" rx="3"/>
    <rect x="238" y="490" width="52" height="11" rx="3"/>
  </g>
  <path class="dim" d="M300 150 V570" stroke-dasharray="4 6"/>

  <!-- 间距 -->
  <path class="dim" d="M400 340 H436" marker-end="url(#d2)"/>
  <path class="dim" d="M400 340 V418" marker-start="url(#d2)" marker-end="url(#d2)"/>
  <path class="dim" d="M400 418 H436" marker-end="url(#d2)"/>
  <text class="t m" x="446" y="374">spacingY = 3</text>
  <text class="t m" x="446" y="394">地板 2 × 0.4</text>
  <text class="t m" x="446" y="414" fill="#8b93a1">x ∈ [−3, 3]</text>

  <!-- 玩家 -->
  <rect x="294" y="307" width="13" height="33" rx="6.5" fill="#e8eefc" stroke="#7f95bd" stroke-width="1.6"/>
  <circle cx="300.5" cy="316" r="2.8" fill="#2f9e7f"/>
  <path d="M314 318 L330 314" fill="none" stroke="#2f9e7f" stroke-width="1.4" marker-end="url(#lead)"/>
  <text class="t m" x="336" y="308" fill="#2f7f68">玩家</text>
  <text class="t s" x="336" y="330" fill="#2f7f68">(0.25, 1.285)</text>

  <!-- 说明 -->
  <text class="t s" x="24" y="592">掉出虚线框 ＝ 撞上尖刺 ＝ 判定死亡。整条规则靠父子关系实现，没有一行视口判断。</text>
</svg>
